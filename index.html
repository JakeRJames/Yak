.lbox input{font-size:18px;height:54px;text-align:center;padding:12px 14px;border-radius:12px;background:#3a3a37;border-color:#55534f;color:#fff;letter-spacing:.12em;max-width:none}.lbox input:focus{outline:2px solid var(--dot)}
.lbox .btn{width:100%;margin-top:10px;padding:11px 14px;font-size:16px;background:var(--dot);color:#1f1e1d}
.lkv{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));margin:0;text-align:center;font-size:12px;color:#8a877f;letter-spacing:.04em;pointer-events:none}.lkerr{min-height:22px;margin:10px 0 0;font-size:14px;color:#ff9d94}.lbox p.lkt{color:#b8b5ad;font-size:14px;margin:0 0 12px}.lbox .ghost.lkf{color:#b8b5ad;margin-top:6px;font-size:14px}.lbox .btn.lko{background:none;color:#fff;border:1.5px solid #77746d}
/* mobile menu: hidden on desktop, replaces the tabs on narrow screens */
.mbtn,.mlist{display:none}
@media(max-width:480px){
.inp{padding:12px}.flds{gap:10px}.fld{flex-basis:130px;max-width:calc(50% - 5px)}
.fld{padding:10px 8px 9px}.fld .mny input{font-size:21px}.fld .mny .cur+input{padding-left:20px;padding-right:20px}
}
@media(max-width:360px){.fld{max-width:none}}
@media(max-width:640px){
header{align-items:center;gap:0 12px;padding:12px 16px}
h1{font-size:26px}
nav{display:none}
.mbtn{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font:600 15px var(--f);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:8px 12px 8px 16px;cursor:pointer;transition:background .2s}
.mbtn[aria-expanded="true"]{background:rgba(255,255,255,.16)}
.mbtn svg{width:16px;height:16px;flex:none;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.mbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.mlist{display:grid;flex:0 0 100%;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .28s cubic-bezier(.3,.7,.2,1),opacity .2s}
.mlist.open{grid-template-rows:1fr;opacity:1}
.mlist>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .28s}
.mlist.open>div{visibility:visible;transition-delay:0s}
.mlist button:first-child{margin-top:10px}
.mlist button{display:block;width:100%;text-align:left;font:500 16px var(--f);color:#d6d3ca;background:none;border:0;border-top:1px solid rgba(255,255,255,.1);padding:13px 4px;cursor:pointer;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
.mlist.open button{opacity:1;transform:none;transition:opacity .25s calc(var(--i)*.04s + .06s),transform .25s calc(var(--i)*.04s + .06s)}
.mlist button:active{color:#fff}
}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hacts{margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center}
.hx{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--f);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:6px 12px;cursor:pointer;position:relative;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.hx:hover{background:rgba(255,255,255,.14)}.hx svg{width:15px;height:15px;flex:none}
.hx.dirty::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--dot);border:2px solid var(--brand)}
.hx.ic{padding:6px 9px}
.bnav{display:none}
@media(max-width:640px){
 header{padding:10px 16px}
 .hx.ic{display:none}
 main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(4px + env(safe-area-inset-bottom,0px))}
 .bnav button{font:600 10.5px var(--f);color:var(--mute);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 4px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
 .bnav svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.3,.7,.2,1)}
 .bnav button.on{color:var(--acc)}
 .bnav button.on::before{content:"";position:absolute;top:-7px;left:50%;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--acc);transform:translateX(-50%)}
 .bnav button:active svg{transform:scale(.88)}
 .foot-acts{display:none}
}
/* bottom sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,20,19,.48);opacity:0;transition:opacity .28s}
.scrim.open{opacity:1}.scrim[hidden],.sheet[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .34s cubic-bezier(.3,.7,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25);overscroll-behavior:contain}
.sheet.open{transform:none}.sheet.drag{transition:none}
@media(min-width:641px){.sheet{bottom:auto;top:50%;width:calc(100% - 48px);border-radius:20px;padding:14px 22px 22px;transform:translateY(-46%);opacity:0;transition:transform .28s cubic-bezier(.3,.7,.2,1),opacity .2s}.sheet.open{transform:translateY(-50%);opacity:1}.sheet .grab{display:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{font:800 21px var(--f);margin:0 0 4px;letter-spacing:-.4px}
.sheet .sf{display:block;margin:16px 0 0}.sheet .sf>span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.sheet .sf input{text-align:left;height:48px;font-size:17px}.sheet .sf .mny .cur+input{padding-left:28px}
.sheet .acts{display:flex;gap:10px;margin-top:22px}.sheet .acts .btn{flex:1;padding:13px;font-size:15px;border-radius:12px}
.segc{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.segc button{font:600 13px var(--f);border:0;background:none;color:var(--mute);padding:10px 6px;border-radius:9px;cursor:pointer;transition:background .2s,color .2s}
.segc.s3{grid-template-columns:repeat(3,1fr);margin:2px 0 4px}
.segc button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.mlinks{display:grid;gap:1px;margin:4px -6px}
.mlinks button{display:flex;align-items:center;gap:14px;width:100%;font:600 16px var(--f);color:var(--ink);background:none;border:0;border-radius:12px;padding:11px 8px;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
.mlinks button:hover,.mlinks button:active{background:var(--bg)}
.mlinks svg{width:22px;height:22px;color:var(--acc);flex:none}
.mlinks small{display:block;font-weight:500;font-size:12.5px;margin-top:1px}
.mlinks .dz,.mlinks .dz svg{color:var(--bad)}
.shd{font:700 11.5px var(--f);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 2px 4px}
/* list rows: tap to edit */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.list>.li:last-child,.list>:last-child{border-bottom:0}
.li:hover{background:color-mix(in srgb,var(--bg) 55%,transparent)}.li:active{background:var(--bg)}
.li .ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font:800 14px var(--f);background:var(--accbg);color:var(--acc)}
.li .ic svg{width:20px;height:20px}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .tx small{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .am{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}.li .am small{display:block;font-weight:500;font-size:12px}
.li .chev{width:8px;height:8px;border-right:2px solid var(--mute);border-top:2px solid var(--mute);transform:rotate(45deg);flex:none;margin:0 2px 0 -2px;opacity:.55;transition:transform .25s}
.li.open .chev{transform:rotate(135deg)}
.li.zero .am{color:var(--mute);font-weight:600}
.li.tot{cursor:default;background:var(--bg)}.li.tot:hover{background:var(--bg)}.li.tot .tx b,.li.tot .am{font-size:16px}
.li.rent .ic{background:var(--okbg);color:var(--okink)}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;font:700 14px var(--f);color:var(--acc);background:none;border:1.5px dashed var(--line);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:12px;padding:12px;cursor:pointer}
.addrow:hover{background:var(--accbg)}
.mpanel{padding:4px 14px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,transparent);animation:enter .25s ease-out}
.mpanel .dr:first-child{margin-top:4px}
/* hero */
.yhero{position:relative;overflow:hidden;background:var(--brand);color:#fff;border-radius:20px;padding:20px 18px 18px 20px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.yhero::before{content:"";position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(217,119,87,.42),transparent 68%);pointer-events:none}
.yhero .hm{flex:1;min-width:0;position:relative}
.yhero .hi{font:700 15px var(--f);color:#d6d3ca;margin:0 0 12px}
.yhero .hl{font-size:13px;color:#b8b5ad}
.yhero .hv{font:800 clamp(32px,9vw,44px)/1.1 var(--f);letter-spacing:-1px;margin:3px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.yhero .hv.neg{color:#ff9d94}
.yhero .hs{font-size:13px;color:#d6d3ca}.yhero .hs b{color:#fff}
.ring{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;background:none;border:0;padding:0;color:#fff;font:inherit;-webkit-tap-highlight-color:transparent}
.ring .rw{position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg);display:block}
.ring .rt{fill:none;stroke:rgba(255,255,255,.14);stroke-width:7}
.ring .rv{fill:none;stroke:var(--dot);stroke-width:7;stroke-linecap:round}
.ring .rv.anim{animation:ring 1.1s cubic-bezier(.3,.7,.2,1) .15s backwards}
@keyframes ring{from{stroke-dashoffset:100}}
.ring .rl{position:absolute;inset:0;display:grid;place-items:center}
.ring .rl b{font:800 19px var(--f)}
.ring .rc{font-size:11.5px;line-height:1.3;color:#b8b5ad;text-align:center;white-space:nowrap}
.ring.add .rt{stroke:rgba(255,255,255,.2)}.ring .plus{width:24px;height:24px;background:linear-gradient(var(--dot),var(--dot)) center/24px 3px no-repeat,linear-gradient(var(--dot),var(--dot)) center/3px 24px no-repeat;border-radius:2px}.ring.add .rc{color:#d6d3ca;font-weight:600}
.ring:active{transform:scale(.96)}
/* to do */
.todo{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.todo>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;-webkit-tap-highlight-color:transparent}
.todo>summary::-webkit-details-marker{display:none}
.todo .cnt{background:var(--acc);color:var(--amon);border-radius:99px;font-size:12px;padding:1px 8px;flex:none}
.todo .pv{flex:1;min-width:0;font-weight:500;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.todo .pv.bad{color:var(--bad)}
.todo>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
.todo[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.todo[open] .pv{visibility:hidden}
.tdr{display:flex;align-items:center;gap:12px;padding:11px 10px 11px 14px;border-top:1px solid var(--line);font-size:14px}
.tdr .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}.tdr .dot.bad{background:var(--bad)}
.tdr>span{flex:1;min-width:0}.tdr b{display:block}.tdr small{display:block;font-size:12.5px}
.tdr .btn{flex:none}.tdr .x{flex:none;background:none;border:0;color:var(--mute);font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:16px;overflow:hidden}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.fold table{border:0;border-radius:0;border-top:1px solid var(--line)}
/* glance and KPI tiles */
.glance2,.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.glance2>*,.kgrid>*{min-width:0}
.glance2>:last-child:nth-child(odd),.kgrid>:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:760px){.glance2,.kgrid{display:flex}.glance2>*,.kgrid>*{flex:1 1 0}}
.glance2 .card,.kgrid .card{padding:13px 14px;margin:0}
.glance2 .big,.kgrid .big{font-size:clamp(19px,5.4vw,24px);letter-spacing:-.4px}
.glance2 .lbl,.kgrid .lbl{font-size:12.5px;line-height:1.35}
.tapc{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.tapc:hover{border-color:var(--mute)}.tapc:active{transform:scale(.98)}
.tapc .lbl::after{content:" ›";color:var(--acc);font-weight:700}
.simhero{margin-bottom:10px}.simhero .ut b{color:inherit}
.dgo{display:block;color:var(--acc);font-weight:600;margin-top:2px}
.gline{stroke:var(--gink);stroke-width:1.5;stroke-dasharray:6 4}.gtx{fill:var(--gink);font:600 11px var(--f)}
/* motion */
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
#app.enter>*{animation:enter .38s cubic-bezier(.3,.7,.2,1) backwards}
#app.enter>:nth-child(2){animation-delay:.04s}#app.enter>:nth-child(3){animation-delay:.08s}#app.enter>:nth-child(4){animation-delay:.12s}#app.enter>:nth-child(5){animation-delay:.16s}#app.enter>:nth-child(n+6){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){#app.enter>*,.mpanel,.ring .rv.anim{animation:none!important}.sheet,.scrim,.bnav svg{transition:none!important}}
@media(prefers-reduced-motion:reduce){.dseg,.ln,.ar,.pt{animation:none!important}.sdseg{transition:none}.mbtn,.mbtn svg,.mlist,.mlist>div,.mlist button{transition:none!important}}
</style></head><body>
<header><h1 onclick="tab('dash')">YAK<span>.</span></h1><nav><button id="t-dash" onclick="tab('dash')">Home</button><button id="t-home" onclick="tab('home')">House</button><button id="t-me" onclick="tab('me')">Personal</button><button id="t-pay" onclick="tab('pay')">Payments</button><button id="t-fc" onclick="tab('fc')">Forecast</button><button id="t-sim" onclick="tab('sim')">Simulator</button><button id="t-log" onclick="tab('log')">Changes</button><button id="t-help" onclick="tab('help')">Instructions</button></nav><span class="hacts"><button class="hx" id="hx" onclick="doExport()" aria-label="Export your data"></button><button class="hx ic" onclick="moreOpen()" aria-label="More options"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></span></header>
<div class="lockscr" id="lock" hidden></div>
<main id="app"><div class="card" style="margin:20px 0"><b>YAK needs a web browser to run.</b><p class="lbl">This preview cannot run the app. Open YAK in Safari, Chrome or Edge instead (or use the YAK link) and your saved data will load there.</p></div></main>

<input id="imp" type="file" accept=".json,application/json" class="hide" onchange="doImport(this)">
<script>
const VERSION='4.1.1';
// Versioning: MAJOR = breaking changes to saved data or layout, MINOR = new features, PATCH = fixes and tweaks. Add newest entry first.
const CHANGELOG=[{v:'4.1.1',d:'16 Nov 2026',n:'The + in the Set a goal circle on Home now sits exactly in the centre of the circle. Saved data is unchanged.'},
{v:'4.1.0',d:'16 Nov 2026',n:'Added an Appearance switch in More. Choose Light, Dark or Match phone (the default, which follows your phone or computer setting). The choice is saved on each device and is not included in exports. Saved data is unchanged.'},
{v:'4.0.0',d:'16 Nov 2026',n:'A big refresh that makes YAK feel like a phone app. On phones the pages now sit in a tab bar at the bottom of the screen (Home, House, Personal, Payments and More), and More holds the Forecast, the Simulator, Changes, Instructions and your data options (export, import, your name, passcode lock, updates and reset). Home leads with a greeting and what you can save each month, and the reminders are gathered into one tidy To do list. Bills on the House and Personal tabs are a clean list: tap one to change it or remove it in a panel that slides up, and add new bills the same way. The Forecast shows the chart first, then a compact list of months that you tap to open and add deductions (tapping a point on the chart opens that month too). You can set a savings goal: Home shows your progress in a ring and the Forecast tells you when you will reach it, with the goal drawn on the chart. Numbers count up when a page opens, pages slide in gently, and tapping a slice of the salary chart twice takes you to that part of YAK. The Simulator results are more compact. An Export button with an orange dot when you have unexported changes now sits at the top of every page, and on a phone it opens the share sheet so you can save to Files in one step. YAK now works offline once it has been opened, can be installed as an app on Android and computers, carries its own font, and asks the browser to keep its saved data. Saved data is unchanged apart from the new optional savings goal, which is included in exports.'},
{v:'3.2.0',d:'16 Nov 2026',n:'You can now add your name to YAK. Home asks for it once (or skip it with Not now), and you can add or change it at any time in the Your name box at the top of the Personal tab. Your name is saved in your own data, so it is included when you export and carried to other devices when you import, and each person using YAK has their own. Home greets you by name, and the Personal tab title uses it. Household packs now carry the name of the person who shared them: a housemate importing a pack sees who it is from (for example Pack 2 from Jake) in the import prompts, in the Household pack box and in the change log. Packs from before this version, or from someone without a name set, still show the device they came from. Changes to your name are recorded in the change log. Older data files still import fine.'},{v:'3.1.1',d:'16 Nov 2026',n:'The Instructions tab now has its own guide for housemates. When YAK is in housemate mode it explains what a household pack is, how to import one, what each screen shows (Home, the read-only House tab and the Household pack box), how updates and the warnings work, how your own figures stay separate, and how to leave housemate mode. Anyone managing the bills sees the same guide as before. Also corrected the wording of the Reset prompt in housemate mode. Saved data is unchanged.'},{v:'3.1.0',d:'16 Nov 2026',n:'If you manage the bills and have shared a household pack, YAK now reminds you to share it again when the house bills change. An orange bar saying House bills changed since your last pack, with a Share pack button, appears at the top of every tab, in the same way as the Unexported changes bar. It covers any change to the bills, rent, budget or number of people, and disappears once you share an updated pack (or if the change is put back). It only appears once you have shared a pack, and never in housemate mode. The reminder that used to sit on Home is replaced by this bar; the Share with housemates box on the House tab stays. Saved data is unchanged.'},{v:'3.0.2',d:'16 Nov 2026',n:'Fixed the orange Unexported changes bar appearing after sharing a household pack. Sharing a pack does not change your figures, so it no longer counts as an unexported change. If you had other unsaved changes, the bar still shows as before. Saved data is unchanged.'},{v:'3.0.1',d:'16 Nov 2026',n:'The passcode lock screen now shows the version of YAK installed on the device in small text at the bottom of the screen, so you can check which version you have without unlocking. It appears on the passcode screen and on the Clear this device screen. Saved data is unchanged.'},{v:'3.0.0',d:'16 Nov 2026',n:'Added household packs and housemate mode. If you manage the bills, the House tab now has a Share household pack button. It creates a small file (yak-household-pack.json) containing only the house bills, rent, budget and the number of people in the house, with nothing from Personal, Payments or Forecast. On a phone it opens the share sheet so you can send it by WhatsApp, AirDrop or Messages. Each pack is numbered, and YAK tells you when the house bills have changed since you last shared one. A housemate imports the pack with Import latest data, and their YAK switches to housemate mode: Home becomes a simpler page showing their share this month, the next bill due and every household bill with their share, and the House tab becomes read only. Their own Personal, Forecast and Simulator figures work as normal and are never touched by a pack. When an updated pack is imported, YAK shows what changed (for example Electric +£6.00) and how their share moves before anything is applied. YAK warns before a pack from a different household or an older pack replaces the current one, and before a pack switches a device that already has its own house bills into housemate mode. Leave housemate mode makes the House tab editable again. People in household now notes that it is the total number of people in the house, including you. Older data files still import fine.'},{v:'2.16.2',d:'16 Nov 2026',n:'On Home, the Payments tile in At a glance (Payments overdue, or Payments up to date) now sits directly underneath the You can save each month tile, instead of at the end. On a phone it follows the savings tile straight away; on a wider screen it sits in the same column, beneath it. Saved data is unchanged.'},{v:'2.16.1',d:'16 Nov 2026',n:'Tidied the buttons in the What do you want to do section on Home. They are now a neat grid of equal-sized tiles that line up flush with each other and with the rest of the page, instead of a ragged row of outlined pills. Each tile has the same height, left-aligned text and a small orange arrow, and highlights in orange when tapped or hovered. On a phone they sit two to a row, with the last one running the full width; on a wider screen they sit four then three across. Saved data is unchanged.'},{v:'2.16.0',d:'16 Nov 2026',n:'YAK now checks for updates by itself every time it opens, and again when you come back to it after it has been in the background. If a newer version is available, a bar saying Update available for YAK appears at the top of the page with an Update button, which does the same as Check for updates. If you are up to date, nothing appears. The Check for updates button at the bottom of every page still works as before. Saved data is unchanged.'},{v:'2.15.2',d:'16 Nov 2026',n:'Fixed the spacing of the buttons in the prompt boxes, such as Import latest data and Start with the starting values. The filled orange button no longer looks like it overlaps the outlined one: they now sit in a row with an even gap between them (and wrap neatly onto two lines on a phone), with matching heights. The same spacing is used in the replace-data, reset, passcode and household-bills prompts. Saved data is unchanged.'},{v:'2.15.1',d:'16 Nov 2026',n:'Added a Check for updates button at the bottom of every page. The YAK app on an iPhone Home Screen can keep showing an older copy of the page after an update. Check for updates fetches the latest copy and, if it is newer than the one you are using, reloads YAK with it. If you are already up to date it tells you so. Your saved data is not touched.'},
{v:'2.15.0',d:'16 Nov 2026',n:'Added an Instructions tab for anyone new to YAK. It explains in plain language what each tab does, how the numbers are worked out, and how exporting and importing your data works, including how to move between devices safely and what to do if you forget your passcode. A How to use YAK button on Home takes you straight to it. Saved data is unchanged.'},{v:'2.14.0',d:'16 Nov 2026',n:'Added a reminder at the top of every tab when the passcode lock is off on this device, saying that anyone who opens YAK here can see your figures. Set a passcode takes you to the Passcode lock card on Home, and the reminder disappears once a passcode is set. Don\'t remind me hides it, and that choice is saved in your data, so it is included in exports and carried to other devices when you import. The reminder waits until you have imported or chosen starting values on a new device. Older data files still import fine.'},
{v:'2.13.1',d:'16 Nov 2026',n:'Added the YAK logo as the app icon (white YAK with an orange full stop on charcoal) and named the app YAK, so it shows on the iPhone Home Screen when added from Safari. Saved data is unchanged.'},
{v:'2.13.0',d:'15 Nov 2026',n:'Removed the Extra adjustment this month box from the Personal tab, along with the Adjustment line in How it adds up and the Adjustments slice in the salary charts. One-off costs such as credit card payments now live only on the Forecast tab, where each month\'s deductions are entered. Monthly savings on Home and Personal no longer have an adjustment taken off, and the Forecast and Simulator start from that same figure. An adjustment saved in an older data file is dropped when it is opened or imported, so if you had one entered your monthly saving will rise by that amount; add it as a Forecast deduction instead if you still need it.'},
{v:'2.12.0',d:'15 Nov 2026',n:'Exports are now recorded in the change log, as imports already were. Each export adds a line saying the data was exported to a file, with the file name and the device, and the line is included in the file itself. Imports now also record which device the file came from and when it was exported there. An export you cancel is not recorded. Saved data is unchanged.'},
{v:'2.11.1',d:'15 Nov 2026',n:'Polished the − and + buttons. The symbols are now drawn precisely so they sit exactly in the centre of each round button, and on the Payments tab the Payment day buttons are slightly smaller and set in from the edges of the box so they line up neatly with the number. The People in household buttons use the same design. Saved data is unchanged.'},
{v:'2.11.0',d:'15 Nov 2026',n:'Added a Payments tile to At a glance on Home. It shows the total overdue amount from the Payments tab in red, or a green Payments up to date when everyone has paid in full. If nothing is overdue yet but some payments are still to come, it says Nothing overdue and shows how much is still to come. It only appears once you have housemates. Saved data is unchanged.'},
{v:'2.10.0',d:'15 Nov 2026',n:'Added a Payments tab for tracking what your housemates pay you. Each month has a record showing the total owed (each housemate owes the individual share from the House tab), with a Paid in full tick or an amount received for each housemate, and an All paid in full tick for the month. The top of the page shows what is outstanding and received this month, the total owed to you and how much is overdue, and each housemate has a card showing what they owe across all months. You can name each housemate and set the day of the month they pay by: a red Overdue pill shows when that day has passed without full payment, and a green Paid pill shows when they are paid up. Past months keep the share that applied at the time, earlier months can be added, and payments are recorded in the change log and included in exports. Older data files still import fine.'},
{v:'2.9.2',d:'14 Nov 2026',n:'Tidied the layout of the value boxes at the top of the House, Personal and Forecast tabs. When they wrap onto more than one row (for example on a phone), the last row is now centred under the row above with the same box size, instead of sitting to the left with a gap beside it. A single box is centred too. The rows of summary cards fill their row with no gaps. Saved data is unchanged.'},
{v:'2.9.1',d:'14 Nov 2026',n:'Removed the cumulative figures from the House tab: the Cumulative, individual share and Cumulative, whole household boxes, the Cumulative per person column, and the Months counted this year box that only fed them. Saved data is unchanged.'},
{v:'2.9.0',d:'14 Nov 2026',n:'Added a change log. YAK now records every change you make to a value, bill or date (what changed, from what to what, and when), and keeps the record inside your data file so it is exported and imported with your data. A new Changes tab shows a Summary view (each item with its first and latest value over 24 hours, 7 days, 30 days or all time) and an Every change view (a timeline). Added, removed and repeated bills and deductions, imports and resets are recorded too. Quick repeat edits to the same box are merged into one line, and the log keeps the latest 1,000 entries. Changes made before this version are not in the log. Older data files still import fine.'},
{v:'2.8.1',d:'14 Nov 2026',n:'Fixed the Date taken boxes on the House tab being squashed on phones so the dates could not be read. They now keep a fixed, wider size and the table scrolls sideways if needed. Saved data is unchanged.'},
{v:'2.8.0',d:'14 Nov 2026',n:'Redesigned the text and number boxes. Boxes are now taller with rounded corners and centred text, and glow orange when you tap into them. The boxes at the top of the House, Personal and Forecast tabs are tiles with the title above a large centred amount, a £ sign for money and − and + buttons for people and months. The bill tables, Forecast deductions, Simulator and passcode boxes use the same style. Tapping a number box selects it so you can type straight over it, Enter or Tab moves to the next box, and you stay in the box you tap into instead of losing your place. New bills and deductions are ready to type into straight away. Saved data is unchanged.'},
{v:'2.7.0',d:'13 Nov 2026',n:'Added a clear title at the top of each page so it is obvious what you are looking at: House Finances, Personal Finances, Savings Forecast and Scenario Simulator. Home keeps the YAK. logo as its heading. Saved data is unchanged.'},
{v:'2.6.11',d:'13 Nov 2026',n:'The titles above the data entry boxes (people in household, monthly rent, monthly salary and so on) are now bold and darker so they stand out. The Updated dates underneath are unchanged. Saved data is unchanged.'},
{v:'2.6.10',d:'13 Nov 2026',n:'The data entry boxes on the House, Personal and Forecast tabs (people in household, rent, budget, salary, spend, savings and so on) now sit inside their own grey panel, matching the other sections of the app, instead of floating on the page background. Saved data is unchanged.'},
{v:'2.6.9',d:'13 Nov 2026',n:'On Home, the Passcode lock box now sits at the very bottom of the page, below the Where your salary goes chart. Saved data is unchanged.'},
{v:'2.6.8',d:'13 Nov 2026',n:'The Last exported bar at the top of every page is now a single thin line with a small Export button, so it takes up very little room and works as a notice. When there are unexported changes it turns orange and reads Unexported changes. The last imported details were removed from the bar; the Switched device box on Home is unchanged. Saved data is unchanged.'},
{v:'2.6.7',d:'13 Nov 2026',n:'On Home, the What do you want to do section now sits directly under Switched device, and its large boxes are replaced by four small buttons (Manage house bills, Track personal finances, Forecast your savings, Simulate a scenario) that take up much less room. Saved data is unchanged.'},
{v:'2.6.6',d:'13 Nov 2026',n:'The At a glance section on Home now shows four boxes instead of eight: how much you can save each month, your individual share each month, personal deductions each month, and the owed back or house bills paid separately box. The house budget, household total, forecast and house bills so far boxes were removed. Saved data is unchanged.'},
{v:'2.6.5',d:'13 Nov 2026',n:'In the export banner at the top of each page, every date and time is now bold, including the one in the From line that shows when the file was exported on the other device. Saved data is unchanged.'},
{v:'2.6.4',d:'13 Nov 2026',n:'Added an On / Off indicator next to the Passcode lock title on the Home tab. It is a small orange pill when the lock is on and a grey one when it is off. Saved data is unchanged.'},
{v:'2.6.3',d:'13 Nov 2026',n:'Fixed the spacing of the Last exported and Last imported box on phones. It now has even padding all round, evenly spaced lines, and the Export data button sits underneath with a clear gap. Saved data is unchanged.'},
{v:'2.6.2',d:'13 Nov 2026',n:'Tidied the Last exported and Last imported text at the top of each page. On phones each part now sits on its own line (last exported, last imported, then which device the file came from and when it was exported there) instead of running together. On wider screens it stays on one line with more spacing. Saved data is unchanged.'},
{v:'2.6.1',d:'13 Nov 2026',n:'On the Home tab, Your Accounts Keeper in the line under the YAK. logo is now bold and white. Saved data is unchanged.'},
{v:'2.6.0',d:'13 Nov 2026',n:'On phones and other narrow screens, the row of tabs is replaced by a collapsible menu. It shows the page you are on with an arrow; tap it and the other pages slide down, then tap one to go there. Tapping elsewhere or pressing Escape closes it. Desktop and wider screens keep the tabs as before. Saved data is unchanged.'},
{v:'2.5.3',d:'13 Nov 2026',n:'On iPhone the passcode boxes now bring up the numeric keypad, and a new passcode set on an iPhone must be numbers only (at least 4). If a passcode was set with letters, a Use letters and numbers button appears on the login screen after a wrong try. Other devices are unchanged.'},
{v:'2.5.2',d:'13 Nov 2026',n:'The passcode lock now locks YAK as soon as you leave the app or switch to another tab, instead of after a minute away. Choosing a file to import or exporting your data will not lock YAK for the next minute, so the file picker does not interrupt you.'},
{v:'2.5.1',d:'13 Nov 2026',n:'Fixed the passcode lock not appearing on a phone after YAK had been left open in the background. YAK now compares the clock each time it wakes up, so it locks after a minute away even when the phone does not report that the page was hidden.'},
{v:'2.5.0',d:'12 Nov 2026',n:'Added an optional passcode lock. Turn it on from the Home tab and YAK shows a login screen with just the YAK. logo and a passcode box each time it opens on that device, and again after a minute away. You can change or turn off the passcode, lock YAK straight away from Home, or clear the device if you forget it. The passcode is stored on the device only and is not included in exports. It keeps casual access out but does not encrypt your data. Saved data is unchanged.'},
{v:'2.4.0',d:'12 Nov 2026',n:'The bar at the top of every tab now also shows when data was last imported on this device, which device the file came from and when it was exported there. This helps you spot when you may need to import a newer file. Saved data is unchanged.'},
{v:'2.3.2',d:'12 Nov 2026',n:'Made the Data last exported bar thinner and cleaner, and changed Export data from a link to a button.'},
{v:'2.3.1',d:'12 Nov 2026',n:'On the Simulator tab, the monthly savings line graph now sits above the cumulative savings line graph.'},
{v:'2.3.0',d:'12 Nov 2026',n:'Added a second line graph to the Simulator showing your savings month by month, measured from each month\'s salary rather than as a running total. It uses the deductions you entered on the Forecast tab, so months with credit card payments or other deductions dip, and it compares your scenario with your current figures (hover or touch for each month, including the share of salary saved). Saved data is unchanged.'},
{v:'2.2.0',d:'12 Nov 2026',n:'Added a Simulator tab for trying out what-if scenarios. Adjust your salary, house bills (excluding rent), personal bills and spend deductions with sliders or typed amounts. They start from your current figures and a reset button puts them back. A line graph shows how much more (or less) you could save over 6 months to 5 years, a donut chart shows how your salary would be apportioned, and a dashboard shows key figures such as potential monthly savings and potential monthly costs. Nothing in the Simulator changes your saved data.'},
{v:'2.1.0',d:'12 Nov 2026',n:'Added animated charts. A donut chart on Home and Personal shows how your salary is split between house bills, personal bills, spending, adjustments and savings (hover or tap a slice for its amount). An interactive line graph on Forecast shows your savings balance rising or falling month by month (hover or touch the line for each month). Charts animate when a page opens. Saved data is unchanged.'},
{v:'2.0.2',d:'12 Nov 2026',n:'Fixed bill names being squashed to nothing on the House tab on narrow screens such as iPhones. Names now keep a minimum width and the table scrolls sideways instead.'},
{v:'2.0.1',d:'12 Nov 2026',n:'Starting values are now all zero (household of 1 person, as the minimum), so YAK opens clean on a new device. Saved data is unchanged.'},
{v:'2.0.0',d:'11 Nov 2026',n:'Works when hosted as a web page and opened on a phone. Added an Import latest data button on Home, a prompt to import on a new device, a prompt after time away asking whether you have used YAK on another device, a warning before an older file can replace newer data, a fixed export file name (yak-data.json) and a message when the file is opened in a viewer that cannot run it. Pop-up boxes replaced with on-page prompts. Saved data is unchanged.'},
{v:'1.4.0',d:'11 Nov 2026',n:'Rebranded from budg.it to YAK (Your Accounts Keeper): new white YAK logo with an orange full stop, and a grey, white and orange colour scheme. The font and all saved data are unchanged.'},
{v:'1.3.1',d:'10 Nov 2026',n:'Accuracy check: household size is now a whole number, months counted is limited to 0-12, bill names can no longer break the page, the Home dashboard no longer shows a wrong answer before the bill question is answered, and a note explains penny rounding.'},
{v:'1.3.0',d:'10 Nov 2026',n:'Added a total household rent field that adds an apportioned Rent line to the bills table automatically. Renamed Your share each month to Individual share each month.'},
{v:'1.2.0',d:'10 Nov 2026',n:'Added last-updated dates against values and bills, and a prompt to re-review bills when nothing has changed for 3 months.'},
{v:'1.1.3',d:'10 Nov 2026',n:'Reverted v1.1.2: the prompt is orange only when there are unexported changes, as in v1.1.1.'},
{v:'1.1.2',d:'10 Nov 2026',n:'The export prompt is now also orange before any export has been made.'},
{v:'1.1.1',d:'10 Nov 2026',n:'The unexported-changes prompt is now orange.'},
{v:'1.1.0',d:'10 Nov 2026',n:'Added data export and import. A prompt appears when changes have not been exported, and shows when data was last exported.'},
{v:'1.0.1',d:'10 Nov 2026',n:'Fixed the tagline overlapping the logo on the Home page.'},

function hhApply(){if(!HH)return;const mo=(S.home&&+S.home.months)||0;S.home=packHome(HH.pack);S.home.months=mo;if(S.me)S.me.fromAcct='no'}

const lockOK=()=>!!(window.crypto&&crypto.subtle);
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));

async function lh(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256))}

const NUMK=/iPhone/.test(navigator.userAgent); // iPhone: show the numeric keypad for passcodes

function checkAway(){if(M.fresh)return;const lo=Date.parse(M.lastOpen)||0;if(lo&&Date.now()-lo>=GAP)ASK=true;else if(!ASK){M.lastOpen=new Date().toISOString();saveMeta()}}
checkAway();
document.addEventListener('visibilitychange',()=>{if(M.fresh)return;
 if(document.hidden){if(!ASK){M.lastOpen=new Date().toISOString();saveMeta()}}
 else{const lo=Date.parse(M.lastOpen)||0;if(!ASK&&lo&&Date.now()-lo>=GAP){ASK=true;render()}}});
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function iso(){return new Date().toISOString()}
function dd(i){return i?new Date(i).toLocaleDateString('en-GB',{dateStyle:'medium'}):'-'}
function ut(path){return `<small class="ut">Updated ${dd((S.upd||{})[path])}</small>`}
const SCALARS=['home.people','home.rentTotal','home.budget','home.months','me.salary','me.spend','fcStart'];
function migrate(){let ch=false;const n=iso();
 if(S.home.rentTotal===undefined){const i=S.home.bills.findIndex(b=>/^rent$/i.test(b.n));let t=0,d='15th';
  if(i>=0){const b=S.home.bills[i];t=b.t==='each'?b.a*(+S.home.people||1):b.a;d=b.d||d;S.home.bills.splice(i,1)}
  S.home.rentTotal=Math.round(t*100)/100;S.home.rentDate=d;ch=true}
 if(!S.lastChange){S.lastChange=n;ch=true}
 if(!S.upd){S.upd={};ch=true}
 if(!Array.isArray(S.log)){S.log=[];ch=true}
 if(!S.goal||typeof S.goal!=='object'){S.goal={a:0};ch=true}
 if(!S.pay||typeof S.pay.m!=='object'||!S.pay.m||!Array.isArray(S.pay.mates)){S.pay={start:null,mates:[],m:{}};ch=true}
 if(S.me&&'adj' in S.me){delete S.me.adj;delete S.upd['me.adj'];ch=true}
 SCALARS.forEach(k=>{if(!S.upd[k]){S.upd[k]=n;ch=true}});
 [...S.home.bills,...S.me.bills].forEach(b=>{if(!b.u){b.u=n;ch=true}});
 return ch}
function save(quiet){if(quiet!==true){S.lastChange=iso();M.dirty=true;saveMeta()}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function needsReview(){const ref=Math.max(Date.parse(S.lastChange)||0,Date.parse(S.reviewed)||0),t=new Date(ref);t.setMonth(t.getMonth()+3);return Date.now()>=t.getTime()}

function reviewBox(){if(!needsReview())return '';
 const ref=Math.max(Date.parse(S.lastChange)||0,Date.parse(S.reviewed)||0);
 return `<div class="card review" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span><b>Time to re-review your bills and update your values.</b> Nothing has been changed or checked since ${dd(new Date(ref).toISOString())}.</span><button class="btn" onclick="reviewDone()">Checked, and everything is the same</button></div>`}
function lockHintBox(){if(!lockOK()||lockInfo()||LOCKED||S.hideLockHint||LK.mode||M.fresh||PEND)return '';
 return `<div class="card review" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between"><span><b>Passcode lock is off.</b> Anyone who opens YAK on this device can see your figures.</span><span class="bar"><button class="btn sm" ${BTN} onclick="lkHintSet()">Set a passcode</button><button class="btn sm out" onclick="lkHintOff()">Don't remind me</button></span></div>`}
function lkHintSet(){S.tab='dash';MO=false;PLAY=true;save(true);lkMode('set');const c=document.getElementById('lkc');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});const i=document.getElementById('lk-p1');if(i)setTimeout(()=>i.focus({preventScroll:true}),350)}

function stamp(iso){return new Date(iso).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}
function dl(name,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function doExport(){
 NOLOCK=Date.now()+60000;
 const now=new Date(),name='yak-data.json';
 const ent={k:'sys',l:'Exported data to a file',x:name+' (from '+deviceName()+')'};logc(ent);let kept=false;
 const txt=JSON.stringify({app:'YAK',version:VERSION,exported:now.toISOString(),device:deviceName(),data:S,household:HH?HH.pack:undefined},null,2);
 try{
  let done=false;
  if(MOB&&navigator.canShare&&navigator.share){let f=null;try{f=new File([txt],name,{type:'application/json'})}catch(e){}
   if(f&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'YAK data'});done=true}catch(e){if(e&&e.name==='AbortError')return}}}
  const dn=!done&&(window.claude&&claude.use)?await claude.use('downloads'):null;
  if(done){}
  else if(dn){try{await dn.save({filename:name,data:txt});done=true}catch(e){if(e&&e.code==='declined')return;throw e}}
  else if(window.showSaveFilePicker){
   try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'YAK data',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(txt);await w.close();done=true}
   catch(e){if(e.name==='AbortError')return}
  }
  if(!done)dl(name,txt);
  kept=true;save(true);M.dirty=false;M.last=now.toISOString();saveMeta();render();
 }catch(e){say('Export failed: '+(e&&e.message||'unknown error'))}
 finally{if(!kept){const i=S.log.lastIndexOf(ent);if(i>=0)S.log.splice(i,1)}}
}
function say(t){MSG=t;render()}
function openImport(){NOLOCK=Date.now()+60000;const i=document.getElementById('imp');if(i)i.click()}
function doImport(inp){
 const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const j=JSON.parse(rd.result);
  if(j&&j.type==='household-pack'){if(!j.home||!Array.isArray(j.home.bills))throw new Error('This household pack is incomplete.');PPK=pkPend(j,f.name);PEND=null;MSG=null;render();inp.value='';return}
  const d=j.data||j;
  if(!d||!d.home||!d.me)throw new Error('This does not look like a YAK data file.');
  const fl=Date.parse(d.lastChange)||Date.parse(j.exported)||0,ll=Date.parse(S.lastChange)||0;
  PEND={d,name:f.name,device:j.device||'',exported:j.exported||'',fl,ll,older:!!(!M.fresh&&fl&&ll&&fl<ll),hh:j.household&&j.household.home&&Array.isArray(j.household.home.bills)?j.household:null};PPK=null;
  MSG=null;render()}catch(e){MSG='Import failed: '+e.message;render()}inp.value=''};
 rd.onerror=()=>{MSG='That file could not be read.';render()};
 rd.readAsText(f)}
function applyImport(){const p=PEND;if(!p)return;S=p.d;S.fc=S.fc||{};S.fcStart=S.fcStart||0;S.tab=S.tab||'dash';migrate();HH=p.hh?{pack:p.hh,imported:iso(),name:p.name,diff:[]}:null;saveHH();hhApply();logc({k:'sys',l:'Imported data from a file',x:p.name+(p.device?' (from '+p.device+(p.exported?', exported '+stamp(p.exported):'')+')':(p.exported?' (exported '+stamp(p.exported)+')':''))});save(true);
 M.dirty=false;M.fresh=false;M.imported=iso();M.src={device:p.device,exported:p.exported};M.lastOpen=iso();ASK=false;PEND=null;saveMeta();render()}

 if(!el.hidden&&LSHOWN===k)return;el.hidden=false;LSHOWN=k;
 el.innerHTML=LKF?`<div class="lbox"><div class="logo">YAK<span>.</span></div><p class="lkt"><b style="color:#fff">Clear this device?</b><br>This removes YAK's saved data and the passcode from this device only. You can then import your latest export to get your figures back.</p><button class="btn" onclick="lkWipe()">Clear this device</button><button class="btn lko" onclick="LKF=false;render()">Cancel</button></div><p class="lkv">YAK v${VERSION}</p>`
 :`<div class="lbox"><div class="logo">YAK<span>.</span></div><form onsubmit="return lkUnlock(event)"><input id="lkin" type="password" placeholder="Passcode" autocomplete="off" aria-label="Passcode"${kpCur()}><button class="btn" type="submit" id="lkgo">Unlock</button></form><p class="lkerr" id="lkerr" role="alert"></p><button class="ghost lkf" onclick="LKF=true;render()">Forgot passcode?</button></div><p class="lkv">YAK v${VERSION}</p>`;
 const i=document.getElementById('lkin');if(i)setTimeout(()=>i.focus(),50)}
async function lkUnlock(e){e.preventDefault();const i=document.getElementById('lkin'),er=document.getElementById('lkerr'),pw=i.value;if(!pw)return false;
 if(Date.now()<WAITUNTIL){er.textContent='Too many attempts. Try again in '+Math.ceil((WAITUNTIL-Date.now())/1000)+' seconds.';return false}
 let ok=false;try{ok=await lockCheck(pw)}catch(x){}
 if(ok){FAILS=0;LOCKED=false;PLAY=true;render()}
 else{FAILS++;i.value='';if(FAILS%5===0){WAITUNTIL=Date.now()+30000;er.textContent='Too many attempts. Try again in 30 seconds.'}else er.textContent='That passcode is not right.';if(i.getAttribute('inputmode')&&!document.getElementById('lkalt'))er.insertAdjacentHTML('afterend','<button class="ghost lkf" id="lkalt" onclick="lkAlt()">Use letters and numbers</button>');i.focus()}
 return false}

 {const d=r((+b.home.rentTotal||0)-(+a.home.rentTotal||0));if(d)o.push('Rent '+am(d));}

 ${sec('What is housemate mode?',`<p>Someone in your house looks after the household bills in their own copy of YAK. They send you a <b>household pack</b>, a small file holding the house bills, the rent, the budget and how many people live in the house. Importing it puts YAK into <b>housemate mode</b>.</p>

 <li><b>Household bills:</b> every bill in date order with your share and the full bill. Rent is included. The line under it, <b>Split between 3 people in total, including you</b>, shows how many people the bills are divided between. That number counts everyone in the house, you included.</li>
 <li><b>Household pack box:</b> which pack you have, who it is from, when they made it, and buttons to import a new one or leave housemate mode.</li>
 <li><b>Where your salary goes:</b> a ring chart of your share, your bills, your spending and your savings. Touch or hover over a slice to see its amount.</li></ul>`)}
 ${sec('House: the household bills',`<p>This tab shows the full list of household bills from your pack. Each bill shows <b>your share</b>, the <b>full bill</b> and the day it is taken. Rent is shown the same way.</p>
 <ul><li><b>Split between everyone:</b> the amount is divided equally between the people in the house.</li>
 <li><b>Each person pays this:</b> everyone pays the full amount, for example a TV licence that is charged per person.</li></ul>
 <p>If a budget was set, a green or red label shows whether your share is within it. Nothing on this tab can be edited. If a bill looks wrong, tell whoever manages the bills and they will send a new pack. Amounts are rounded to the nearest penny, so the lines can differ from the total by a penny or so.</p>`)}
 ${sec('When the bills change',`<p>When a bill changes, your housemate sends an updated pack. Import it the same way as the first one. Before anything changes, YAK shows you what is different, such as <b>Gas &amp; Electricity +£6.00</b>, and how your share moves from one amount to another. Tap <b>Apply update</b> to go ahead or <b>Cancel</b> to leave things as they are.</p>
 <p>Your own figures are never touched by a pack. YAK also protects you from mix-ups:</p>
 <ul><li><b>An older pack:</b> if you pick a pack that is older than the one you have, YAK warns you before going back to older bills.</li>
 <li><b>A different household:</b> a pack from another household asks you to confirm before it replaces yours.</li>
 <li><b>The same pack:</b> if you already have it, YAK simply tells you.</li></ul>`)}
 ${sec('Personal: what you can save',`<p>Enter your monthly pay after tax, an amount you set aside for spending, and your own bills such as phone, gym or insurance. The <b>How it adds up</b> table walks through the sum line by line: your pay, less your own bills and your share of the household bills, less your spending, leaves what you can save.</p>
 <p>The question about whose account the household bills come out of is not asked in housemate mode. YAK takes off your share only.</p>`)}
 ${sec('Forecast and Simulator',`<p><b>Forecast</b> shows your savings month by month for the next 12 months. Use <b>Add deduction</b> under a month for anything outside your regular bills, such as a credit card payment, and <b>Repeat in later months</b> to copy it forward. If you already have savings, enter them at the top.</p>
 <p><b>Simulator</b> lets you try "what if" changes to your pay, bills and spending with sliders. Nothing in the Simulator is saved or changes your real figures.</p>`)}
 ${sec('Changes: a record of every edit',`<p>YAK keeps a log of every change you make to your own figures, and records when you import a household pack, with a note of what changed. <b>Summary</b> shows each item from its first value to its latest. <b>Every change</b> lists each edit in order, newest first.</p>`)}
 ${sec('Passcode lock (optional)',`<p>You can ask YAK to show a login screen when it opens. Turn it on from <b>More</b>, then <b>Passcode lock</b>. YAK then locks itself as soon as you leave the app. The version number is shown at the bottom of the login screen.</p>
 <ul><li>The passcode belongs to that device only and is not included in exports.</li>
 <li>It keeps casual snoopers out, but it does not scramble your data.</li>
 <li><b>Forgotten it?</b> Choose the option to clear the device, then import your latest export (and the household pack if needed) to get everything back.</li></ul>`)}
 ${sec('Backing up and moving to a new phone',`<p>Tap the <b>Export</b> button at the top of the screen to save your figures into a file called <b>yak-data.json</b>. It includes your own figures and the household pack you have, but not your passcode. On a new phone, open YAK and tap <b>Import latest data</b>, then choose that file. You stay in housemate mode with the same pack.</p>
 <div class="tip"><b>Good to know:</b> importing replaces everything on the device with the file. Use one device at a time: export before you leave a device and import when you arrive on the next. The file is plain text with your finances in it, so keep it somewhere private. If you choose a full YAK data file that did not include a household pack, YAK tells you it will switch housemate mode off before you confirm.</div>`)}

function helpPage(){

 ${sec('What is YAK?',`<p>YAK (Your Accounts Keeper) helps you keep track of money in a shared home. It does two jobs: it works out what each person owes towards the household bills, and it shows what you can save each month once your own bills and spending are taken off your pay.</p>
 <p>It does <b>not</b> connect to your bank, and it does not send your figures anywhere. You type in the numbers, and YAK does the adding up. Everything is kept on the device you are using.</p>

 ${sec('Getting started in five steps',`<ol>
 <li><b>House tab:</b> set how many people live in the household, then the total monthly rent and the monthly budget you want each person to stay within.</li>
 <li><b>House tab:</b> check the list of bills. Type in each amount, or use <b>Add bill</b> for anything missing. Remove any you do not have.</li>
 <li><b>Personal tab:</b> answer the question about whether the household bills come out of your account. Then enter your monthly pay (after tax), the amount you set aside to spend, and your own bills.</li>
 <li><b>Home tab:</b> see your results at a glance, including what you can save each month. Add your name when asked (or on the Personal tab) so YAK can greet you and your housemates can see who their household pack is from.</li>
 <li><b>Export your data</b> once you are happy, so you have a backup (see Moving your data, below).</li>
 </ol><p>All amounts are monthly. Anything you type is saved straight away, so there is no Save button.</p>`)}
 ${sec('Home',`<p>Your summary page. It shows what you can save each month, your share of the house bills, your personal bills, and (when it applies) how much others owe you back. A ring chart shows where your pay goes: house bills, personal bills, spending and savings. Touch or hover over a slice to see its amount.</p>
 <p>The row of small buttons takes you to the other tabs. This page is also where you can import data from another device and turn the passcode lock on or off.</p>`)}
 ${sec('House: sharing the household bills',`<p>This is where the household costs live. Each bill has a name, a monthly amount, the day it is taken and a choice of how it is divided:</p>
 <ul><li><b>Split between everyone:</b> the amount is divided equally by the number of people. Use this for things like gas, electricity, water and wifi.</li>
 <li><b>Each person pays this:</b> everyone pays the full amount. Use this for something that is charged per person, such as a TV licence if each person needs their own.</li></ul>
 <p>Rent is entered once as a total for the whole house and YAK divides it for you. The big figure at the top is your <b>individual share each month</b>, with a green or red label showing whether that is within your budget.</p>
 <p>Each line shows when it was last changed. If nothing has been changed for three months, YAK reminds you to check your bills are still right. Amounts are rounded to the nearest penny, so the lines can differ from the total by a penny or so. YAK will tell you when that happens.</p>`)}
 ${sec('Personal: what you can save',`<p>Enter your monthly pay after tax, an amount you set aside for spending, and your own bills such as phone, gym or insurance.</p>
 <p>The first question matters: <b>do all the household bills come out of your account?</b></p>
 <ul><li><b>Yes:</b> you pay the full household bills and the others pay you back. YAK takes the full amount off, then adds back what the others owe, and shows how much each person owes you.</li>
 <li><b>No:</b> the bills are collected separately, so YAK only takes off your own share.</li></ul>
 <p>The <b>How it adds up</b> table walks through the sum line by line, so you can see how the saving figure is reached. You can change your answer at any time.</p>`)}
 ${sec('Payments: who has paid you',`<p>This tab appears once the household has two or more people. It is for tracking what your housemates pay you.</p>
 <ul><li>Each month has a card showing how much is owed and how much has been received.</li>
 <li>For each housemate, either tick <b>Paid in full</b> or type the amount you received. <b>All paid in full</b> ticks everyone at once.</li>
 <li>Give each housemate a name and the day of the month they should pay by. A red <b>Overdue</b> label appears if that day passes without full payment, and a green <b>Paid</b> label shows when they are up to date.</li>
 <li>Past months keep the share that applied at the time, so changing a bill later does not rewrite history. <b>Add an earlier month</b> lets you go back and record older payments.</li></ul>`)}
 ${sec('Household packs: sharing bills with housemates',`<p>If you manage the household bills, you can send your housemates a <b>household pack</b> so they can see their share in their own copy of YAK.</p>
 <h3>If you manage the bills</h3>
 <ol><li>Set <b>People in household</b> on the House tab to the total number of people in the house, including you.</li>
 <li>Under <b>Share with housemates</b>, tap <b>Share household pack</b>. On a phone the share sheet opens, so you can send it by WhatsApp, AirDrop or Messages. Elsewhere the file <b>yak-household-pack.json</b> is saved.</li>
 <li>When the bills change, YAK reminds you on Home and on the House tab. Tap <b>Share updated pack</b> and send it again.</li></ol>
 <p>The pack holds only the house bills, rent, budget and number of people, plus your name if you have added one so housemates can see who it is from. Nothing from Personal, Payments or Forecast is included, and everyone gets the same file.</p>
 <h3>If you are a housemate</h3>
 <ol><li>Save the pack to Files, open YAK and tap <b>Import latest data</b>.</li>
 <li>YAK switches to <b>housemate mode</b>. Home shows your share this month, the next bill due and every household bill with your share. The House tab is read only.</li>
 <li>Use Personal, Forecast and the Simulator as normal. A pack never changes your own figures.</li>
 <li>When you get an updated pack, import it the same way. YAK shows what changed and how your share moves before you apply it.</li></ol>
 <div class="tip"><b>Good to know:</b> YAK warns you before a pack from a different household or an older pack replaces the one you have. <b>Leave housemate mode</b> on Home or the House tab makes the House tab editable again. Your own exports include the pack, so moving to a new phone keeps it.</div>`)}
 ${sec('Forecast: the next 12 months',`<p>Each of the next 12 months starts from your monthly saving. For anything that is not in your regular bills, such as a credit card payment, use <b>Add deduction</b> under that month. <b>Repeat in later months</b> copies a deduction forward so you do not have to retype it.</p>

 ${sec('Simulator: trying out "what if"',`<p>Want to know what would happen if you got a pay rise, cancelled a subscription or cut your spending? Move the sliders or type new amounts for pay, house bills, personal bills and spending. The charts and figures update straight away to show how much more (or less) you could save over anything from 6 months to 5 years.</p>
 <div class="tip"><b>Nothing here is saved.</b> The Simulator never changes your real figures. Press <b>Reset to current values</b> to start again.</div>`)}
 ${sec('Changes: a record of every edit',`<p>YAK keeps a log of every change you make to a value, bill or date: what it was, what it became, and when. It also records exports and imports. <b>Summary</b> shows each item once, from its first value to its latest. <b>Every change</b> lists each edit in order, newest first.</p>
 <p>It is useful for spotting where a mistake crept in. The log travels inside your exported file, and keeps the latest 1,000 entries.</p>`)}
 ${sec('Passcode lock (optional)',`<p>You can ask YAK to show a login screen when it opens. Turn it on from <b>More</b>, then <b>Passcode lock</b>. YAK then locks itself as soon as you leave the app or switch to another tab or app.</p>
 <ul><li>The passcode belongs to that device only. It is not included in exports, so each device has its own.</li>
 <li>It keeps casual snoopers out, but it does not scramble your data.</li>
 <li><b>Forgotten it?</b> On the login screen choose the option to clear the device. This removes YAK's saved data and the passcode from that device, and you can then import your latest export to get everything back. This is another reason to export regularly.</li></ul>`)}
 ${sec('Exporting your data',`<p>Exporting saves all of your figures into a single file called <b>yak-data.json</b>. That includes your bills, payments, forecast deductions and the change log. It does not include your passcode.</p>
 <h3>How to export</h3>
 <ol><li>Tap the <b>Export</b> button at the top of the screen (or open <b>More</b> and tap <b>Export data</b>).</li>
 <li>Save the file. On a phone the share sheet opens, so choose <b>Save to Files</b>. On a computer you may be asked where to put it.</li></ol>
 <p>The Export button shows an <b>orange dot</b> when you have changed something since your last export, and Home adds <b>Back up your changes</b> to its To do list. That is your cue to export again. More shows when you last exported.</p>
 <div class="tip"><b>Keep it private:</b> the file is plain text with your finances in it, and it is not protected by the passcode. Store it somewhere only you can reach, and do not leave copies lying around.</div>`)}
 ${sec('Importing your data',`<p>Importing loads a YAK file back into the app. Use it to set up a new device, or to bring a device up to date after you have made changes somewhere else.</p>
 <h3>How to import</h3>
 <ol><li>Open <b>More</b> and tap <b>Import latest data</b>.</li>
 <li>Choose your <b>yak-data.json</b> file from Files or Downloads.</li>
 <li>YAK shows the file's name, which device it came from and when it was last changed. Tap <b>Replace my data</b> to go ahead, or <b>Cancel</b> to leave things as they are.</li></ol>
 <h3>Things to know</h3>
 <ul><li><b>Importing replaces everything.</b> The file is not merged with what is already on the device. Whatever is in the file becomes your data.</li>
 <li><b>YAK warns you if the file is older</b> than what is on the device, because importing it would overwrite newer figures. You then have to choose <b>Replace anyway</b>.</li>
 <li>If you choose a file that is not from YAK, you will see a message saying so and nothing changes.</li>
 <li>Files exported from earlier versions of YAK still work.</li></ul>`)}
 ${sec('Moving between devices',`<p>Say you have been using YAK on your laptop and want the latest figures on your phone:</p>
 <ol><li>On the laptop, tap <b>Export</b>.</li>
 <li>Get the file to your phone, for example by AirDrop, email to yourself, or a cloud folder such as iCloud Drive.</li>
 <li>On the phone, open YAK and tap <b>Import latest data</b>.</li></ol>
 <p>YAK helps you remember. On a brand new device it asks <b>"New on this device?"</b> so you can import straight away or start fresh. If you have been away for a day or more it asks <b>"Have you used YAK on another device since?"</b>. <b>Import latest data</b> in <b>More</b> also shows where the data on this device came from.</p>
 <div class="tip"><b>The golden rule:</b> use one device at a time. Export before you leave a device and import when you arrive on the next one. If you make changes on two devices without swapping files, the last file you import wins and the other changes are lost.</div>`)}
 ${sec('Starting again, and backups',`<p>In <b>More</b>, <b>Reset to starting values</b> clears your figures back to blank. YAK asks you to confirm first. Export beforehand if you might want your data back.</p>
 <p>Your figures are stored in your web browser. If you clear your browser's website data or switch browsers, they will not be there. A recent export is your safety net, so get into the habit of exporting after you have made changes.</p>`)}
 </div>`}

/* ---------- Check for updates: fetch the live page fresh and reload if it is newer ---------- */
let UPD='',NEWV='',UCHK=0;
function newer(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false}
async function liveVersion(){
 const r=await fetch(location.pathname,{cache:'reload'});
 if(!r.ok)throw new Error('status '+r.status);
 const m=(await r.text()).match(/<meta name="version" content="([^"]+)"/);
 if(!m)throw new Error('no version');
 return m[1];
}
async function checkUpdate(){
 UPD='Checking...';render();
 try{
  const v=await liveVersion();
  if(v===VERSION){NEWV='';UPD='';say('You have the latest version (v'+VERSION+').');scrollTo(0,0)}
  else{UPD='Updating to v'+v+'...';render();setTimeout(()=>location.reload(),600)}
 }catch(e){UPD='';say('Could not check for updates. You may be offline.');scrollTo(0,0)}
}
/* Quiet check each time YAK opens (and when it comes back from the background), so nobody has to remember to press the button */
async function autoCheckUpdate(){
 if(Date.now()-UCHK<60000)return;UCHK=Date.now();
 try{const v=await liveVersion();const nv=newer(v,VERSION)?v:'';if(nv!==NEWV){NEWV=nv;render()}}catch(e){}
}
function updBox(){return NEWV?`<div class="card pending tb"><span><b>Update available for YAK</b> <small>(v${NEWV})</small></span><button class="btn sm" onclick="checkUpdate()">Update</button></div>`:''}
