 <div class="shd">Appearance</div><div class="segc s3" id="thseg">${[['light','Light'],['dark','Dark'],['auto','Match phone']].map(x=>`<button type="button" data-t="${x[0]}" class="${themeGet()===x[0]?'on':''}" onclick="themeSet('${x[0]}')">${x[1]}</button>`).join('')}</div>
 <div class="shd">App</div><div class="mlinks">${it("sheetClose();checkUpdate()",'upd','Check for updates','YAK v'+VERSION)}${it("sheetClose();reset()",'rst','Reset to starting values','Export first if you want a backup','dz')}</div>`)}
function lkGo(m){sheetClose();if(S.tab!=='dash'){S.tab='dash';PLAY=true;ENTER=true;save(true)}lkMode(m);setTimeout(()=>{const c=document.getElementById('lkc');if(c)c.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});const i=document.getElementById(m==='set'?'lk-p1':'lk-cur');if(i)setTimeout(()=>i.focus({preventScroll:true}),350)},60)}
function lkMore(){sheetOpen(`<h3>Passcode lock is on</h3><p class="lbl" style="margin:0">YAK asks for your passcode when it opens and whenever you leave the app. It keeps casual access out but does not encrypt your data.</p><div class="mlinks" style="margin-top:12px"><button onclick="sheetClose();lockNow()">${ico('lock')}<span>Lock now</span></button><button onclick="lkGo('change')">${ico('upd')}<span>Change passcode</span></button><button class="dz" onclick="lkGo('off')">${ico('rst')}<span>Turn off</span></button></div>`)}
lkHintSet=function(){lkGo('set')};
/* your name */
function nameSheet(){SH={k:'name'};sheetOpen(`<h3>Your name</h3><p class="lbl" style="margin:0">Saved in your own data on this device. YAK uses it to greet you${HM()?'':' and to show your housemates who a household pack is from'}.</p><form onsubmit="event.preventDefault();const v=document.getElementById('ns').value;sheetClose();nameSet(v)"><label class="sf"><span>First name</span><input id="ns" value="${esc(nm())}" maxlength="40" autocomplete="given-name" placeholder="Your first name"></label><div class="acts"><button class="btn" type="submit">Save</button></div></form>`,nm()?null:'#ns')}
function nameRow(){return `<div class="list" style="margin-bottom:16px"><button class="li" onclick="nameSheet()"><span class="ic">${nm()?ini(nm()):ico('me')}</span><span class="tx"><small>Your name</small><b>${nm()?esc(nm()):'Add your name'}</b></span><span class="chev"></span></button></div>`}
/* bills: compact rows, edited in a sheet */
function billList(w,c){const ro=HM()&&w==='home',B=S[w].bills,h=S.home;
 const rows=B.map((b,i)=>{const a=+b.a||0,each=b.t==='each'?a:a/c.p,
  sub=w==='home'?[b.t==='each'?'Each person pays':c.p>1?'Split '+c.p+' ways':'Split between everyone',b.d?'taken '+esc(b.d):''].filter(Boolean).join(', '):'Updated '+dd(b.u);
  return `<button class="li${a?'':' zero'}" onclick="billSheet('${w}',${i})"><span class="ic">${ini(b.n)}</span><span class="tx"><b>${esc(b.n)}</b><small>${sub}</small></span><span class="am">${gbp(a)}${w==='home'&&c.p>1?`<small>${gbp(each)} each</small>`:''}</span><span class="chev"></span></button>`}).join('');
 const rent=w==='home'?`<button class="li rent" onclick="rentSheet()"><span class="ic">${ico('house')}</span><span class="tx"><b>Rent</b><small>${c.p>1?'Split '+c.p+' ways':'Your rent'}${h.rentDate?', taken '+esc(h.rentDate):''}</small></span><span class="am">${gbp(+h.rentTotal||0)}${c.p>1?`<small>${gbp((+h.rentTotal||0)/c.p)} each</small>`:''}</span><span class="chev"></span></button>`:'';
 const tot=w==='home'?`<div class="li tot"><span class="tx"><b>Your share each month</b></span><span class="am">${gbp(c.share)}</span></div>`:`<div class="li tot"><span class="tx"><b>Personal deductions</b></span><span class="am">${gbp(c.mine)}</span></div>`;
 return `<div class="list">${rows}${rent}${tot}</div>${ro?'':`<button class="addrow" onclick="billSheet('${w}',-1)">+ ${w==='home'?'Add a bill':'Add an expense'}</button>`}`}
function billSheet(w,i){if(HM()&&w==='home')return;const isNew=i<0,b=isNew?{n:'',a:0,d:'',t:'split'}:S[w].bills[i];if(!b)return;SH={k:'bill',w,i,t:b.t==='each'?'each':'split'};
 sheetOpen(`<h3>${isNew?(w==='home'?'New house bill':'New personal expense'):esc(b.n)}</h3><p class="lbl" style="margin:0">${w==='home'?'A household bill, shared as you choose below.':'Comes out of your own salary each month.'}</p>
 <form onsubmit="event.preventDefault();billSave()">
 <label class="sf"><span>Name</span><input id="bs-n" value="${esc(b.n)}" placeholder="${w==='home'?'For example, Water':'For example, Netflix'}" maxlength="60" autocomplete="off"></label>
 <label class="sf"><span>Monthly amount</span><span class="mny"><span class="cur">£</span><input id="bs-a" class="num" type="number" inputmode="decimal" step="any" value="${isNew?'':b.a}" placeholder="0.00"></span></label>
 ${w==='home'?`<div class="sf"><span>How it is divided</span><div class="segc"><button type="button" class="${SH.t==='split'?'on':''}" onclick="bsT('split',this)">Split between everyone</button><button type="button" class="${SH.t==='each'?'on':''}" onclick="bsT('each',this)">Each person pays this</button></div></div>
 <label class="sf"><span>Date taken</span><input id="bs-d" value="${esc(b.d||'')}" placeholder="For example, 28th" maxlength="20" autocomplete="off"></label>`:''}
 ${isNew?'':`<p class="lbl" style="margin:14px 0 0">Last updated ${dd(b.u)}</p>`}
 <div class="acts">${isNew?'':`<button type="button" class="btn out" style="color:var(--bad);border-color:var(--bad);flex:0 0 auto" onclick="billDel()">Remove</button>`}<button class="btn" type="submit">${isNew?'Add':'Save'}</button></div></form>`,isNew?'#bs-n':null)}
function bsT(t,el){if(!SH)return;SH.t=t;el.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===el))}
function billSave(){const s=SH;if(!s||s.k!=='bill')return;const g=id=>{const e=document.getElementById(id);return e?e.value:''};
 const n=g('bs-n').trim().slice(0,60)||(s.w==='home'?'New bill':'New expense'),a=Math.round((parseFloat(g('bs-a'))||0)*100)/100,d=g('bs-d').trim();let ch=false;
 if(s.i<0){const nb=s.w==='home'?{n,a,d,t:s.t,u:iso()}:{n,a,u:iso()};S[s.w].bills.push(nb);logc({k:'add',l:'Added '+(s.w==='home'?'house bill':'personal bill'),x:'"'+n+'"'+(a?', '+gbp(a):'')});ch=true}
 else{const b=S[s.w].bills[s.i],pre=s.w+'.bills.'+s.i+'.';if(!b)return sheetClose();
  if(b.n!==n)ch=setQ(pre+'n',n)||ch;if(Math.abs((+b.a||0)-a)>1e-9)ch=setQ(pre+'a',a,1)||ch;
  if(s.w==='home'){if((b.t==='each'?'each':'split')!==s.t)ch=setQ(pre+'t',s.t)||ch;if((b.d||'')!==d)ch=setQ(pre+'d',d)||ch}}
 sheetClose();if(ch){save();render()}}
function billDel(){const s=SH;if(!s||s.k!=='bill'||s.i<0)return;sheetClose();del(s.w,s.i)}
function rentSheet(){if(HM())return;SH={k:'rent'};const h=S.home,c=calc();
 sheetOpen(`<h3>Rent</h3><p class="lbl" style="margin:0">${c.p>1?`Your share is <b>${gbp((+h.rentTotal||0)/c.p)}</b> of ${gbp(+h.rentTotal||0)}, split ${c.p} ways.`:`${gbp(+h.rentTotal||0)} a month.`} Change the amount in the boxes at the top of the House tab.</p><form onsubmit="event.preventDefault();const v=document.getElementById('rs-d').value.trim();sheetClose();if(v!==(S.home.rentDate||'')){setQ('home.rentDate',v);save();render()}"><label class="sf"><span>Date taken</span><input id="rs-d" value="${esc(h.rentDate||'')}" maxlength="20" placeholder="For example, 15th" autocomplete="off"></label><div class="acts"><button class="btn" type="submit">Save</button></div></form>`)}
/* savings goal */
function goalReach(c){const T=+S.goal.a||0;if(!(T>0))return null;let bal=+S.fcStart||0;if(bal>=T)return{done:true};const ms=months(),now=new Date();
 for(let i=0;i<600;i++){const k=i<12?ms[i].k:null;bal+=c.save-(k?sum(S.fc[k]||[],x=>+x.a||0):0);
  if(bal>=T){const d=new Date(now.getFullYear(),now.getMonth()+i,1);return{when:d.toLocaleString('en-GB',{month:'long',year:'numeric'}),short:d.toLocaleString('en-GB',{month:'short',year:'numeric'}),n:i+1}}
  if(i>=11&&c.save<=0)break}
 return{never:true}}
function goalSheet(){SH={k:'goal'};const c=calc(),G=+S.goal.a||0,r=goalReach(c),have=+S.fcStart||0;
 const txt=!G?'Set a target and YAK works out when you will reach it, using your monthly saving and the deductions on the Forecast tab.':r.done?`You have reached your goal of <b>${gbp(G)}</b>.`:r.never?`At your current monthly saving of ${gbp(c.save)}, you will not reach <b>${gbp(G)}</b>. Try the Simulator to see what would change that.`:`At your current pace you will reach <b>${gbp(G)}</b> in <b>${r.when}</b>, ${r.n} month${r.n>1?'s':''} from now.`;
 sheetOpen(`<h3>Savings goal</h3><p class="lbl" style="margin:0">${txt}</p><form onsubmit="event.preventDefault();goalSave()"><label class="sf"><span>Goal amount</span><span class="mny"><span class="cur">£</span><input id="gs-a" class="num" type="number" inputmode="decimal" step="any" value="${G||''}" placeholder="For example, 10000"></span></label><label class="sf"><span>Savings you already have</span><span class="mny"><span class="cur">£</span><input id="gs-h" class="num" type="number" inputmode="decimal" step="any" value="${have||''}" placeholder="0"></span></label><div class="acts">${G?`<button type="button" class="btn out" style="flex:0 0 auto" onclick="document.getElementById('gs-a').value='';goalSave()">Remove goal</button>`:''}<button class="btn" type="submit">Save</button></div></form>`,G?null:'#gs-a')}
function goalSave(){const a=Math.max(0,parseFloat(document.getElementById('gs-a').value)||0),hv=Math.max(0,parseFloat(document.getElementById('gs-h').value)||0);let ch=false;
 if(Math.abs((+S.goal.a||0)-a)>1e-9)ch=setQ('goal.a',a,1)||ch;if(Math.abs((+S.fcStart||0)-hv)>1e-9)ch=setQ('fcStart',hv,1)||ch;sheetClose();if(ch){save();PLAY=true;render()}}
function goalRing(c){const G=+S.goal.a||0;
 if(!G)return `<button class="ring add" onclick="goalSheet()" aria-label="Set a savings goal"><span class="rw"><svg viewBox="0 0 42 42"><circle class="rt" cx="21" cy="21" r="15.9155"/></svg><span class="rl"><i class="plus"></i></span></span><span class="rc">Set a goal</span></button>`;
 const have=+S.fcStart||0,p=Math.max(0,Math.min(1,have/G)),r=goalReach(c);
 return `<button class="ring" onclick="goalSheet()" aria-label="Savings goal: ${Math.round(p*100)} percent of ${gbp(G)}"><span class="rw"><svg viewBox="0 0 42 42"><circle class="rt" cx="21" cy="21" r="15.9155"/><circle class="rv${PLAY&&!RM?' anim':''}" cx="21" cy="21" r="15.9155" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="${(100-p*100).toFixed(2)}"/></svg><span class="rl"><b>${Math.round(p*100)}%</b></span></span><span class="rc">of ${axl(G)}${r&&r.short?'<br>by '+esc(r.short.replace(/ \d\d(\d\d)$/,' $1')):''}</span></button>`}
/* Home */
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function heroBox(c){const n=nm(),sal=+S.me.salary||0,neg=c.save<0;
 return `<section class="yhero"><div class="hm"><p class="hi">${greet()}${n?', '+esc(n):''}</p><div class="hl">${c.yes?'You will save each month once repaid':'You can save each month'}</div><div class="hv${neg?' neg':''}">${gbp(c.save)}</div><div class="hs">${!sal?'Add your salary on the Personal tab to get started':neg?'Your outgoings are more than your salary':`That is <b>${Math.round(c.save/sal*100)}%</b> of your salary`}</div></div>${goalRing(c)}</section>`}
function tcard(l,v,t){return `<button class="card tapc" onclick="tab('${t}')"><div class="lbl">${l}</div><div class="big">${v}</div></button>`}
function todoItems(){const t=[];
 if(M.dirty){const age=M.last?Math.floor((Date.now()-Date.parse(M.last))/864e5):null;t.push({h:'Back up your changes',s:M.last?'Last exported '+(age<1?'today':age===1?'yesterday':age+' days ago')+'.':'You have not exported yet.',b:`<button class="btn sm" onclick="doExport()">Export</button>`,bad:age===null||age>=7})}
 if(needsReview()){const ref=Math.max(Date.parse(S.lastChange)||0,Date.parse(S.reviewed)||0);t.push({h:'Time to review your bills',s:'Nothing has changed or been checked since '+dd(new Date(ref).toISOString())+'.',b:`<button class="btn sm" onclick="reviewDone()">All the same</button>`})}
 if(lockOK()&&!lockInfo()&&!S.hideLockHint&&!LK.mode&&!M.fresh&&!PEND)t.push({h:'Passcode lock is off',s:'Anyone who opens YAK here can see your figures.',b:`<button class="btn sm" onclick="lkGo('set')">Set one</button>`,x:'lkHintOff()'});
 if(!nm()&&!S.hideName&&!M.fresh&&!PPK&&!PEND&&!LEAVE)t.push({h:'Add your name',s:'So YAK can greet you'+(HM()?'':' and housemates can see who packs are from')+'.',b:`<button class="btn sm" onclick="nameSheet()">Add</button>`,x:'S.hideName=true;save(true);render()'});
 return t}
function todoCard(){const t=todoItems();if(!t.length)return '';const bad=t.find(x=>x.bad);
 return `<details class="todo"${TDO?' open':''} ontoggle="TDO=this.open"><summary>To do <span class="cnt">${t.length}</span><span class="pv${bad?' bad':''}">${esc((bad||t[0]).h)}</span></summary>${t.map(x=>`<div class="tdr"><i class="dot${x.bad?' bad':''}"></i><span><b>${x.h}</b><small>${x.s}</small></span>${x.b}${x.x?`<button class="x" onclick="${x.x}" aria-label="Dismiss">×</button>`:''}</div>`).join('')}</details>`}
/* donut: tap a slice or key twice to open that part of YAK */
const DTAB={'House bills (your share)':'home','Personal bills':'me','Spending allocated':'me','Savings':'fc'};
function dTap(i){const d=DD;if(!d)return;const t=DTAB[d.it[i].n],go=t&&t!==S.tab;if(DTI===i&&go){DTI=-1;tab(t);return}DTI=i;dHi(i);if(go){const m=document.getElementById('dmid');if(m)m.insertAdjacentHTML('beforeend','<small class="dgo">Tap again to open</small>')}}
/* forecast months */
function fcTog(k){FCO=FCO===k?null:k;render();if(FCO){const e=document.getElementById('m-'+k);if(e)e.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})}}
function fcPick(){const g=FCG;if(!g||!g.cur)return;const m=months()[g.cur-1];if(!m)return;FCO=m.k;render();const e=document.getElementById('m-'+m.k);if(e)e.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'})}
/* numbers count up when a page opens */
function countUp(){if(RM)return;document.querySelectorAll('#app .big,#app .hv').forEach(el=>{const t=el.textContent.trim(),m=t.match(/^(-?)£([\d,]+\.\d\d)$/);if(!m)return;const v=(m[1]?-1:1)*parseFloat(m[2].replace(/,/g,''));if(!v)return;const t0=performance.now(),D=750;
 const st=n=>{if(!el.isConnected)return;const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,3);el.textContent=p<1?gbp(v*e):t;if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
/* appearance: Light, Dark or Match phone. Saved on this device only (yak.theme), never exported */
function themeGet(){try{const t=localStorage.getItem('yak.theme');return t==='light'||t==='dark'?t:'auto'}catch(e){return 'auto'}}
function themeMeta(){const r=document.documentElement,t=r.getAttribute('data-theme'),dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches,m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?'#30302e':'#262624'}
function themeSet(t){try{if(t==='auto')localStorage.removeItem('yak.theme');else localStorage.setItem('yak.theme',t)}catch(e){}
 const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);themeMeta();
 document.querySelectorAll('#thseg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
themeMeta();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeMeta)}catch(e){}
/* offline app and storage that the browser should keep */
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)return navigator.storage.persist()}).catch(()=>{})}catch(e){}
/* ---------- Page names (the desktop tabs; phones use the bottom tab bar) ---------- */
const TITLES={home:'House Finances',hmhome:'Household Bills',me:'Personal Finances',pay:'Housemate Payments',fc:'Savings Forecast',sim:'Scenario Simulator',log:'Change Log',help:'How to use YAK'};
const PAGES=[['dash','Home'],['home','House'],['me','Personal'],['pay','Payments'],['fc','Forecast'],['sim','Simulator'],['log','Changes'],['help','Instructions']];
let MO=false;
function mSync(){const b=document.getElementById('mbtn'),l=document.getElementById('mlist');if(!b||!l)return;b.setAttribute('aria-expanded',String(MO));l.classList.toggle('open',MO)}
function mToggle(){MO=!MO;if(MO){document.getElementById('mitems').innerHTML=PAGES.filter(p=>p[0]!==S.tab&&!(HM()&&p[0]==='pay')).map((p,i)=>`<button style="--i:${i}" onclick="tab('${p[0]}')">${p[1]}</button>`).join('')}mSync()}
document.addEventListener('click',e=>{if(MO&&!e.target.closest('#mbtn,#mlist')){MO=false;mSync()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MO){MO=false;mSync();const b=document.getElementById('mbtn');if(b)b.focus()}});
function render(){
 QR=false;
 if(LOCKED){MO=false;sheetClose();document.getElementById('app').innerHTML='';showLock();return}
 document.getElementById('lock').hidden=true;LSHOWN='';
 if(HM()&&S.tab==='pay')S.tab='dash';
 const c=calc(),PN=HM()?0:paySync(c);
 document.getElementById('t-pay').style.display=HM()?'none':'';
 PAGES.forEach(p=>{document.getElementById('t-'+p[0]).className=S.tab===p[0]?'on':''});
 document.getElementById('bnav').innerHTML=bnav();hxSync();
 document.getElementById('app').innerHTML=banner()+(TITLES[HM()&&S.tab==='home'?'hmhome':S.tab]?`<h2 class="ptitle">${S.tab==='me'&&nm()?esc(nm())+'\'s Personal Finances':TITLES[HM()&&S.tab==='home'?'hmhome':S.tab]}</h2>`:'')+(S.tab==='dash'?(HM()?hmDash(c):dash(c)):S.tab==='home'?(HM()?hmHouse(c):home(c)):S.tab==='pay'?payPage(c,PN):S.tab==='fc'?fc(c):S.tab==='sim'?simPage(c):S.tab==='log'?logPage():S.tab==='help'?helpPage():me(c))+`<p style="margin-top:30px"><small>Saved automatically in this browser. </small><span class="foot-acts"><button class="ghost" style="color:var(--acc)" onclick="openImport()">Import latest data</button><button class="ghost" onclick="reset()">Reset to starting values</button><br><button class="ghost" style="color:var(--acc)" onclick="checkUpdate()">Check for updates</button></span> <small>${UPD}</small></p>
 <details><summary><small>YAK v${VERSION}: version history</small></summary><table class="sum" style="margin-top:8px">${CHANGELOG.map(x=>`<tr><td><b>v${x.v}</b> <small>${x.d}</small></td><td style="text-align:left">${x.n}</td></tr>`).join('')}</table></details>`;
 if(S.tab==='sim')simDraw(PLAY);
 if(PLAY)countUp();
 const ap=document.getElementById('app');if(ENTER&&!RM){ap.classList.remove('enter');void ap.offsetWidth;ap.classList.add('enter');clearTimeout(ENT);ENT=setTimeout(()=>ap.classList.remove('enter'),700)}ENTER=false;
 PLAY=false;
}
let LW=document.documentElement.clientWidth;
addEventListener('resize',()=>{const w=document.documentElement.clientWidth;if(w!==LW){LW=w;if(S.tab==='fc'||S.tab==='sim')render()}});
if(migrate())save(true);
render();
autoCheckUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoCheckUpdate()});
addEventListener('pageshow',e=>{if(e.persisted)autoCheckUpdate()});
</script></body></html>
