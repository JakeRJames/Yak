.lkerr{min-height:22px;margin:10px 0 0;font-size:14px;color:#ff9d94}.lbox p.lkt{color:#b8b5ad;font-size:14px;margin:0 0 12px}.lbox .ghost.lkf{color:#b8b5ad;margin-top:6px;font-size:14px}.lbox .btn.lko{background:none;color:#fff;border:1.5px solid #77746d}
/* mobile menu: hidden on desktop, replaces the tabs on narrow screens */
.mbtn,.mlist{display:none}
@media(max-width:480px){
.inp{padding:12px}.flds{gap:10px}.fld{flex-basis:130px;max-width:calc(50% - 5px)}
.fld{padding:10px 8px 9px}.fld .mny input{font-size:21px}.fld .mny .cur+input{padding-left:20px;padding-right:20px}
}
@media(max-width:360px){.fld{max-width:none}}
@media(max-width:640px){
header{align-items:center;gap:0 12px;padding:12px 16px}
h1{font-size:26px}
nav{display:none}
.mbtn{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font:600 15px var(--f);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:8px 12px 8px 16px;cursor:pointer;transition:background .2s}
.mbtn[aria-expanded="true"]{background:rgba(255,255,255,.16)}
.mbtn svg{width:16px;height:16px;flex:none;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.mbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.mlist{display:grid;flex:0 0 100%;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .28s cubic-bezier(.3,.7,.2,1),opacity .2s}
.mlist.open{grid-template-rows:1fr;opacity:1}
.mlist>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .28s}
.mlist.open>div{visibility:visible;transition-delay:0s}
.mlist button:first-child{margin-top:10px}
.mlist button{display:block;width:100%;text-align:left;font:500 16px var(--f);color:#d6d3ca;background:none;border:0;border-top:1px solid rgba(255,255,255,.1);padding:13px 4px;cursor:pointer;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
.mlist.open button{opacity:1;transform:none;transition:opacity .25s calc(var(--i)*.04s + .06s),transform .25s calc(var(--i)*.04s + .06s)}
.mlist button:active{color:#fff}
}
@media(prefers-reduced-motion:reduce){.dseg,.ln,.ar,.pt{animation:none!important}.sdseg{transition:none}.mbtn,.mbtn svg,.mlist,.mlist>div,.mlist button{transition:none!important}}

<main id="app"><div class="card" style="margin:20px 0"><b>YAK needs a web browser to run.</b><p class="lbl">This preview cannot run the app. Open YAK in Safari, Chrome or Edge instead (or use the YAK link) and your saved data will load there.</p></div></main>
<script>
const VERSION='3.0.0';
// Versioning: MAJOR = breaking changes to saved data or layout, MINOR = new features, PATCH = fixes and tweaks. Add newest entry first.
const CHANGELOG=[{v:'3.0.0',d:'16 Nov 2026',n:'Added household packs and housemate mode. If you manage the bills, the House tab now has a Share household pack button. It creates a small file (yak-household-pack.json) containing only the house bills, rent, budget and the number of people in the house, with nothing from Personal, Payments or Forecast. On a phone it opens the share sheet so you can send it by WhatsApp, AirDrop or Messages. Each pack is numbered, and YAK tells you when the house bills have changed since you last shared one. A housemate imports the pack with Import latest data, and their YAK switches to housemate mode: Home becomes a simpler page showing their share this month, the next bill due and every household bill with their share, and the House tab becomes read only. Their own Personal, Forecast and Simulator figures work as normal and are never touched by a pack. When an updated pack is imported, YAK shows what changed (for example Electric +£6.00) and how their share moves before anything is applied. YAK warns before a pack from a different household or an older pack replaces the current one, and before a pack switches a device that already has its own house bills into housemate mode. Leave housemate mode makes the House tab editable again. People in household now notes that it is the total number of people in the house, including you. Older data files still import fine.'},{v:'2.16.2',d:'16 Nov 2026',n:'On Home, the Payments tile in At a glance (Payments overdue, or Payments up to date) now sits directly underneath the You can save each month tile, instead of at the end. On a phone it follows the savings tile straight away; on a wider screen it sits in the same column, beneath it. Saved data is unchanged.'},{v:'2.16.1',d:'16 Nov 2026',n:'Tidied the buttons in the What do you want to do section on Home. They are now a neat grid of equal-sized tiles that line up flush with each other and with the rest of the page, instead of a ragged row of outlined pills. Each tile has the same height, left-aligned text and a small orange arrow, and highlights in orange when tapped or hovered. On a phone they sit two to a row, with the last one running the full width; on a wider screen they sit four then three across. Saved data is unchanged.'},{v:'2.16.0',d:'16 Nov 2026',n:'YAK now checks for updates by itself every time it opens, and again when you come back to it after it has been in the background. If a newer version is available, a bar saying Update available for YAK appears at the top of the page with an Update button, which does the same as Check for updates. If you are up to date, nothing appears. The Check for updates button at the bottom of every page still works as before. Saved data is unchanged.'},{v:'2.15.2',d:'16 Nov 2026',n:'Fixed the spacing of the buttons in the prompt boxes, such as Import latest data and Start with the starting values. The filled orange button no longer looks like it overlaps the outlined one: they now sit in a row with an even gap between them (and wrap neatly onto two lines on a phone), with matching heights. The same spacing is used in the replace-data, reset, passcode and household-bills prompts. Saved data is unchanged.'},{v:'2.15.1',d:'16 Nov 2026',n:'Added a Check for updates button at the bottom of every page. The YAK app on an iPhone Home Screen can keep showing an older copy of the page after an update. Check for updates fetches the latest copy and, if it is newer than the one you are using, reloads YAK with it. If you are already up to date it tells you so. Your saved data is not touched.'},
{v:'2.15.0',d:'16 Nov 2026',n:'Added an Instructions tab for anyone new to YAK. It explains in plain language what each tab does, how the numbers are worked out, and how exporting and importing your data works, including how to move between devices safely and what to do if you forget your passcode. A How to use YAK button on Home takes you straight to it. Saved data is unchanged.'},{v:'2.14.0',d:'16 Nov 2026',n:'Added a reminder at the top of every tab when the passcode lock is off on this device, saying that anyone who opens YAK here can see your figures. Set a passcode takes you to the Passcode lock card on Home, and the reminder disappears once a passcode is set. Don\'t remind me hides it, and that choice is saved in your data, so it is included in exports and carried to other devices when you import. The reminder waits until you have imported or chosen starting values on a new device. Older data files still import fine.'},
{v:'2.13.1',d:'16 Nov 2026',n:'Added the YAK logo as the app icon (white YAK with an orange full stop on charcoal) and named the app YAK, so it shows on the iPhone Home Screen when added from Safari. Saved data is unchanged.'},
{v:'2.13.0',d:'15 Nov 2026',n:'Removed the Extra adjustment this month box from the Personal tab, along with the Adjustment line in How it adds up and the Adjustments slice in the salary charts. One-off costs such as credit card payments now live only on the Forecast tab, where each month\'s deductions are entered. Monthly savings on Home and Personal no longer have an adjustment taken off, and the Forecast and Simulator start from that same figure. An adjustment saved in an older data file is dropped when it is opened or imported, so if you had one entered your monthly saving will rise by that amount; add it as a Forecast deduction instead if you still need it.'},
{v:'2.12.0',d:'15 Nov 2026',n:'Exports are now recorded in the change log, as imports already were. Each export adds a line saying the data was exported to a file, with the file name and the device, and the line is included in the file itself. Imports now also record which device the file came from and when it was exported there. An export you cancel is not recorded. Saved data is unchanged.'},
{v:'2.11.1',d:'15 Nov 2026',n:'Polished the − and + buttons. The symbols are now drawn precisely so they sit exactly in the centre of each round button, and on the Payments tab the Payment day buttons are slightly smaller and set in from the edges of the box so they line up neatly with the number. The People in household buttons use the same design. Saved data is unchanged.'},
{v:'2.11.0',d:'15 Nov 2026',n:'Added a Payments tile to At a glance on Home. It shows the total overdue amount from the Payments tab in red, or a green Payments up to date when everyone has paid in full. If nothing is overdue yet but some payments are still to come, it says Nothing overdue and shows how much is still to come. It only appears once you have housemates. Saved data is unchanged.'},
{v:'2.10.0',d:'15 Nov 2026',n:'Added a Payments tab for tracking what your housemates pay you. Each month has a record showing the total owed (each housemate owes the individual share from the House tab), with a Paid in full tick or an amount received for each housemate, and an All paid in full tick for the month. The top of the page shows what is outstanding and received this month, the total owed to you and how much is overdue, and each housemate has a card showing what they owe across all months. You can name each housemate and set the day of the month they pay by: a red Overdue pill shows when that day has passed without full payment, and a green Paid pill shows when they are paid up. Past months keep the share that applied at the time, earlier months can be added, and payments are recorded in the change log and included in exports. Older data files still import fine.'},
{v:'2.9.2',d:'14 Nov 2026',n:'Tidied the layout of the value boxes at the top of the House, Personal and Forecast tabs. When they wrap onto more than one row (for example on a phone), the last row is now centred under the row above with the same box size, instead of sitting to the left with a gap beside it. A single box is centred too. The rows of summary cards fill their row with no gaps. Saved data is unchanged.'},
{v:'2.9.1',d:'14 Nov 2026',n:'Removed the cumulative figures from the House tab: the Cumulative, individual share and Cumulative, whole household boxes, the Cumulative per person column, and the Months counted this year box that only fed them. Saved data is unchanged.'},
{v:'2.9.0',d:'14 Nov 2026',n:'Added a change log. YAK now records every change you make to a value, bill or date (what changed, from what to what, and when), and keeps the record inside your data file so it is exported and imported with your data. A new Changes tab shows a Summary view (each item with its first and latest value over 24 hours, 7 days, 30 days or all time) and an Every change view (a timeline). Added, removed and repeated bills and deductions, imports and resets are recorded too. Quick repeat edits to the same box are merged into one line, and the log keeps the latest 1,000 entries. Changes made before this version are not in the log. Older data files still import fine.'},
{v:'2.8.1',d:'14 Nov 2026',n:'Fixed the Date taken boxes on the House tab being squashed on phones so the dates could not be read. They now keep a fixed, wider size and the table scrolls sideways if needed. Saved data is unchanged.'},
{v:'2.8.0',d:'14 Nov 2026',n:'Redesigned the text and number boxes. Boxes are now taller with rounded corners and centred text, and glow orange when you tap into them. The boxes at the top of the House, Personal and Forecast tabs are tiles with the title above a large centred amount, a £ sign for money and − and + buttons for people and months. The bill tables, Forecast deductions, Simulator and passcode boxes use the same style. Tapping a number box selects it so you can type straight over it, Enter or Tab moves to the next box, and you stay in the box you tap into instead of losing your place. New bills and deductions are ready to type into straight away. Saved data is unchanged.'},
{v:'2.7.0',d:'13 Nov 2026',n:'Added a clear title at the top of each page so it is obvious what you are looking at: House Finances, Personal Finances, Savings Forecast and Scenario Simulator. Home keeps the YAK. logo as its heading. Saved data is unchanged.'},
{v:'2.6.11',d:'13 Nov 2026',n:'The titles above the data entry boxes (people in household, monthly rent, monthly salary and so on) are now bold and darker so they stand out. The Updated dates underneath are unchanged. Saved data is unchanged.'},
{v:'2.6.10',d:'13 Nov 2026',n:'The data entry boxes on the House, Personal and Forecast tabs (people in household, rent, budget, salary, spend, savings and so on) now sit inside their own grey panel, matching the other sections of the app, instead of floating on the page background. Saved data is unchanged.'},
{v:'2.6.9',d:'13 Nov 2026',n:'On Home, the Passcode lock box now sits at the very bottom of the page, below the Where your salary goes chart. Saved data is unchanged.'},
{v:'2.6.8',d:'13 Nov 2026',n:'The Last exported bar at the top of every page is now a single thin line with a small Export button, so it takes up very little room and works as a notice. When there are unexported changes it turns orange and reads Unexported changes. The last imported details were removed from the bar; the Switched device box on Home is unchanged. Saved data is unchanged.'},
{v:'2.6.7',d:'13 Nov 2026',n:'On Home, the What do you want to do section now sits directly under Switched device, and its large boxes are replaced by four small buttons (Manage house bills, Track personal finances, Forecast your savings, Simulate a scenario) that take up much less room. Saved data is unchanged.'},
{v:'2.6.6',d:'13 Nov 2026',n:'The At a glance section on Home now shows four boxes instead of eight: how much you can save each month, your individual share each month, personal deductions each month, and the owed back or house bills paid separately box. The house budget, household total, forecast and house bills so far boxes were removed. Saved data is unchanged.'},
{v:'2.6.5',d:'13 Nov 2026',n:'In the export banner at the top of each page, every date and time is now bold, including the one in the From line that shows when the file was exported on the other device. Saved data is unchanged.'},
{v:'2.6.4',d:'13 Nov 2026',n:'Added an On / Off indicator next to the Passcode lock title on the Home tab. It is a small orange pill when the lock is on and a grey one when it is off. Saved data is unchanged.'},
{v:'2.6.3',d:'13 Nov 2026',n:'Fixed the spacing of the Last exported and Last imported box on phones. It now has even padding all round, evenly spaced lines, and the Export data button sits underneath with a clear gap. Saved data is unchanged.'},
{v:'2.6.2',d:'13 Nov 2026',n:'Tidied the Last exported and Last imported text at the top of each page. On phones each part now sits on its own line (last exported, last imported, then which device the file came from and when it was exported there) instead of running together. On wider screens it stays on one line with more spacing. Saved data is unchanged.'},
{v:'2.6.1',d:'13 Nov 2026',n:'On the Home tab, Your Accounts Keeper in the line under the YAK. logo is now bold and white. Saved data is unchanged.'},
{v:'2.6.0',d:'13 Nov 2026',n:'On phones and other narrow screens, the row of tabs is replaced by a collapsible menu. It shows the page you are on with an arrow; tap it and the other pages slide down, then tap one to go there. Tapping elsewhere or pressing Escape closes it. Desktop and wider screens keep the tabs as before. Saved data is unchanged.'},
{v:'2.5.3',d:'13 Nov 2026',n:'On iPhone the passcode boxes now bring up the numeric keypad, and a new passcode set on an iPhone must be numbers only (at least 4). If a passcode was set with letters, a Use letters and numbers button appears on the login screen after a wrong try. Other devices are unchanged.'},
{v:'2.5.2',d:'13 Nov 2026',n:'The passcode lock now locks YAK as soon as you leave the app or switch to another tab, instead of after a minute away. Choosing a file to import or exporting your data will not lock YAK for the next minute, so the file picker does not interrupt you.'},
{v:'2.5.1',d:'13 Nov 2026',n:'Fixed the passcode lock not appearing on a phone after YAK had been left open in the background. YAK now compares the clock each time it wakes up, so it locks after a minute away even when the phone does not report that the page was hidden.'},
{v:'2.5.0',d:'12 Nov 2026',n:'Added an optional passcode lock. Turn it on from the Home tab and YAK shows a login screen with just the YAK. logo and a passcode box each time it opens on that device, and again after a minute away. You can change or turn off the passcode, lock YAK straight away from Home, or clear the device if you forget it. The passcode is stored on the device only and is not included in exports. It keeps casual access out but does not encrypt your data. Saved data is unchanged.'},
{v:'2.4.0',d:'12 Nov 2026',n:'The bar at the top of every tab now also shows when data was last imported on this device, which device the file came from and when it was exported there. This helps you spot when you may need to import a newer file. Saved data is unchanged.'},
{v:'2.3.2',d:'12 Nov 2026',n:'Made the Data last exported bar thinner and cleaner, and changed Export data from a link to a button.'},
{v:'2.3.1',d:'12 Nov 2026',n:'On the Simulator tab, the monthly savings line graph now sits above the cumulative savings line graph.'},
{v:'2.3.0',d:'12 Nov 2026',n:'Added a second line graph to the Simulator showing your savings month by month, measured from each month\'s salary rather than as a running total. It uses the deductions you entered on the Forecast tab, so months with credit card payments or other deductions dip, and it compares your scenario with your current figures (hover or touch for each month, including the share of salary saved). Saved data is unchanged.'},
{v:'2.2.0',d:'12 Nov 2026',n:'Added a Simulator tab for trying out what-if scenarios. Adjust your salary, house bills (excluding rent), personal bills and spend deductions with sliders or typed amounts. They start from your current figures and a reset button puts them back. A line graph shows how much more (or less) you could save over 6 months to 5 years, a donut chart shows how your salary would be apportioned, and a dashboard shows key figures such as potential monthly savings and potential monthly costs. Nothing in the Simulator changes your saved data.'},
{v:'2.1.0',d:'12 Nov 2026',n:'Added animated charts. A donut chart on Home and Personal shows how your salary is split between house bills, personal bills, spending, adjustments and savings (hover or tap a slice for its amount). An interactive line graph on Forecast shows your savings balance rising or falling month by month (hover or touch the line for each month). Charts animate when a page opens. Saved data is unchanged.'},
{v:'2.0.2',d:'12 Nov 2026',n:'Fixed bill names being squashed to nothing on the House tab on narrow screens such as iPhones. Names now keep a minimum width and the table scrolls sideways instead.'},
{v:'2.0.1',d:'12 Nov 2026',n:'Starting values are now all zero (household of 1 person, as the minimum), so YAK opens clean on a new device. Saved data is unchanged.'},
{v:'2.0.0',d:'11 Nov 2026',n:'Works when hosted as a web page and opened on a phone. Added an Import latest data button on Home, a prompt to import on a new device, a prompt after time away asking whether you have used YAK on another device, a warning before an older file can replace newer data, a fixed export file name (yak-data.json) and a message when the file is opened in a viewer that cannot run it. Pop-up boxes replaced with on-page prompts. Saved data is unchanged.'},
{v:'1.4.0',d:'11 Nov 2026',n:'Rebranded from budg.it to YAK (Your Accounts Keeper): new white YAK logo with an orange full stop, and a grey, white and orange colour scheme. The font and all saved data are unchanged.'},
{v:'1.3.1',d:'10 Nov 2026',n:'Accuracy check: household size is now a whole number, months counted is limited to 0-12, bill names can no longer break the page, the Home dashboard no longer shows a wrong answer before the bill question is answered, and a note explains penny rounding.'},
{v:'1.3.0',d:'10 Nov 2026',n:'Added a total household rent field that adds an apportioned Rent line to the bills table automatically. Renamed Your share each month to Individual share each month.'},
{v:'1.2.0',d:'10 Nov 2026',n:'Added last-updated dates against values and bills, and a prompt to re-review bills when nothing has changed for 3 months.'},
{v:'1.1.3',d:'10 Nov 2026',n:'Reverted v1.1.2: the prompt is orange only when there are unexported changes, as in v1.1.1.'},
{v:'1.1.2',d:'10 Nov 2026',n:'The export prompt is now also orange before any export has been made.'},
{v:'1.1.1',d:'10 Nov 2026',n:'The unexported-changes prompt is now orange.'},
{v:'1.1.0',d:'10 Nov 2026',n:'Added data export and import. A prompt appears when changes have not been exported, and shows when data was last exported.'},
{v:'1.0.1',d:'10 Nov 2026',n:'Fixed the tagline overlapping the logo on the Home page.'},

function calc(){

function dayOf(d){const m=String(d||'').match(/\d{1,2}/);return m?Math.min(31,Math.max(1,+m[0])):null}
function nextOn(day){const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());for(let i=0;i<2;i++){const y=t.getFullYear(),mo=t.getMonth()+i,last=new Date(y,mo+1,0).getDate(),dt=new Date(y,mo,Math.min(day,last));if(dt>=t0)return dt}return null}
function dueList(c){const h=S.home,o=h.bills.map(b=>({n:b.n,full:b.t==='each'?(+b.a||0)*c.p:+b.a||0,mine:b.t==='each'?+b.a||0:(+b.a||0)/c.p,t:b.t,d:b.d||''}));
 if(+h.rentTotal)o.push({n:'Rent',full:+h.rentTotal,mine:(+h.rentTotal)/c.p,t:'split',d:h.rentDate||''});
 o.forEach(x=>{const dy=dayOf(x.d);x.next=dy?nextOn(dy):null});
 return o.sort((a,b)=>(a.next?a.next.getTime():9e15)-(b.next?b.next.getTime():9e15))}
const fdd=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function whenTxt(d){const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate()),n=Math.round((d-t0)/864e5);return n===0?'Today':n===1?'Tomorrow':fdd(d)}

/* ---------- Instructions: a plain-language guide for new users ---------- */
function helpPage(){
 const sec=(t,b,o)=>`<details${o?' open':''}><summary>${t}</summary><div class="hb">${b}</div></details>`;
 return `<div class="hp"><p class="lead">A short guide to what YAK does and how to look after your data. Tap a heading to open it.</p>
 ${sec('What is YAK?',`<p>YAK (Your Accounts Keeper) helps you keep track of money in a shared home. It does two jobs: it works out what each person owes towards the household bills, and it shows what you can save each month once your own bills and spending are taken off your pay.</p>
 <p>It does <b>not</b> connect to your bank, and it does not send your figures anywhere. You type in the numbers, and YAK does the adding up. Everything is kept on the device you are using.</p>
 <div class="tip"><b>Good to know:</b> because your figures live on this device only, YAK will not appear on your other devices by itself. Use Export and Import (see below) to move your data between a phone and a laptop.</div>`,true)}
 ${sec('Getting started in five steps',`<ol>
 <li><b>House tab:</b> set how many people live in the household, then the total monthly rent and the monthly budget you want each person to stay within.</li>
 <li><b>House tab:</b> check the list of bills. Type in each amount, or use <b>Add bill</b> for anything missing. Remove any you do not have.</li>
 <li><b>Personal tab:</b> answer the question about whether the household bills come out of your account. Then enter your monthly pay (after tax), the amount you set aside to spend, and your own bills.</li>
 <li><b>Home tab:</b> see your results at a glance, including what you can save each month.</li>
 <li><b>Export your data</b> once you are happy, so you have a backup (see Moving your data, below).</li>
 </ol><p>All amounts are monthly. Anything you type is saved straight away, so there is no Save button.</p>`)}
 ${sec('Home',`<p>Your summary page. It shows what you can save each month, your share of the house bills, your personal bills, and (when it applies) how much others owe you back. A ring chart shows where your pay goes: house bills, personal bills, spending and savings. Touch or hover over a slice to see its amount.</p>
 <p>The row of small buttons takes you to the other tabs. This page is also where you can import data from another device and turn the passcode lock on or off.</p>`)}
 ${sec('House: sharing the household bills',`<p>This is where the household costs live. Each bill has a name, a monthly amount, the day it is taken and a choice of how it is divided:</p>
 <ul><li><b>Split between everyone:</b> the amount is divided equally by the number of people. Use this for things like gas, electricity, water and wifi.</li>
 <li><b>Each person pays this:</b> everyone pays the full amount. Use this for something that is charged per person, such as a TV licence if each person needs their own.</li></ul>
 <p>Rent is entered once as a total for the whole house and YAK divides it for you. The big figure at the top is your <b>individual share each month</b>, with a green or red label showing whether that is within your budget.</p>
 <p>Each line shows when it was last changed. If nothing has been changed for three months, YAK reminds you to check your bills are still right. Amounts are rounded to the nearest penny, so the lines can differ from the total by a penny or so. YAK will tell you when that happens.</p>`)}
 ${sec('Personal: what you can save',`<p>Enter your monthly pay after tax, an amount you set aside for spending, and your own bills such as phone, gym or insurance.</p>
 <p>The first question matters: <b>do all the household bills come out of your account?</b></p>
 <ul><li><b>Yes:</b> you pay the full household bills and the others pay you back. YAK takes the full amount off, then adds back what the others owe, and shows how much each person owes you.</li>
 <li><b>No:</b> the bills are collected separately, so YAK only takes off your own share.</li></ul>
 <p>The <b>How it adds up</b> table walks through the sum line by line, so you can see how the saving figure is reached. You can change your answer at any time.</p>`)}
 ${sec('Payments: who has paid you',`<p>This tab appears once the household has two or more people. It is for tracking what your housemates pay you.</p>
 <ul><li>Each month has a card showing how much is owed and how much has been received.</li>
 <li>For each housemate, either tick <b>Paid in full</b> or type the amount you received. <b>All paid in full</b> ticks everyone at once.</li>
 <li>Give each housemate a name and the day of the month they should pay by. A red <b>Overdue</b> label appears if that day passes without full payment, and a green <b>Paid</b> label shows when they are up to date.</li>
 <li>Past months keep the share that applied at the time, so changing a bill later does not rewrite history. <b>Add an earlier month</b> lets you go back and record older payments.</li></ul>`)}
 ${sec('Household packs: sharing bills with housemates',`<p>If you manage the household bills, you can send your housemates a <b>household pack</b> so they can see their share in their own copy of YAK.</p>
 <h3>If you manage the bills</h3>
 <ol><li>Set <b>People in household</b> on the House tab to the total number of people in the house, including you.</li>
 <li>Under <b>Share with housemates</b>, tap <b>Share household pack</b>. On a phone the share sheet opens, so you can send it by WhatsApp, AirDrop or Messages. Elsewhere the file <b>yak-household-pack.json</b> is saved.</li>
 <li>When the bills change, YAK reminds you on Home and on the House tab. Tap <b>Share updated pack</b> and send it again.</li></ol>
 <p>The pack holds only the house bills, rent, budget and number of people. Nothing from Personal, Payments or Forecast is included, and everyone gets the same file.</p>
 <h3>If you are a housemate</h3>
 <ol><li>Save the pack to Files, open YAK and tap <b>Import latest data</b>.</li>
 <li>YAK switches to <b>housemate mode</b>. Home shows your share this month, the next bill due and every household bill with your share. The House tab is read only.</li>
 <li>Use Personal, Forecast and the Simulator as normal. A pack never changes your own figures.</li>
 <li>When you get an updated pack, import it the same way. YAK shows what changed and how your share moves before you apply it.</li></ol>
 <div class="tip"><b>Good to know:</b> YAK warns you before a pack from a different household or an older pack replaces the one you have. <b>Leave housemate mode</b> on Home or the House tab makes the House tab editable again. Your own exports include the pack, so moving to a new phone keeps it.</div>`)}
 ${sec('Forecast: the next 12 months',`<p>Each of the next 12 months starts from your monthly saving. For anything that is not in your regular bills, such as a credit card payment, use <b>Add deduction</b> under that month. <b>Repeat in later months</b> copies a deduction forward so you do not have to retype it.</p>
 <p>If you already have savings, enter them in the optional box at the top. The line graph shows your savings balance month by month. Touch or hover over the line to see each month.</p>`)}
 ${sec('Simulator: trying out "what if"',`<p>Want to know what would happen if you got a pay rise, cancelled a subscription or cut your spending? Move the sliders or type new amounts for pay, house bills, personal bills and spending. The charts and figures update straight away to show how much more (or less) you could save over anything from 6 months to 5 years.</p>
 <div class="tip"><b>Nothing here is saved.</b> The Simulator never changes your real figures. Press <b>Reset to current values</b> to start again.</div>`)}
 ${sec('Changes: a record of every edit',`<p>YAK keeps a log of every change you make to a value, bill or date: what it was, what it became, and when. It also records exports and imports. <b>Summary</b> shows each item once, from its first value to its latest. <b>Every change</b> lists each edit in order, newest first.</p>
 <p>It is useful for spotting where a mistake crept in. The log travels inside your exported file, and keeps the latest 1,000 entries.</p>`)}
 ${sec('Passcode lock (optional)',`<p>You can ask YAK to show a login screen when it opens. Turn it on from the <b>Passcode lock</b> box at the bottom of Home. YAK then locks itself as soon as you leave the app or switch to another tab or app.</p>
 <ul><li>The passcode belongs to that device only. It is not included in exports, so each device has its own.</li>
 <li>It keeps casual snoopers out, but it does not scramble your data.</li>
 <li><b>Forgotten it?</b> On the login screen choose the option to clear the device. This removes YAK's saved data and the passcode from that device, and you can then import your latest export to get everything back. This is another reason to export regularly.</li></ul>`)}
 ${sec('Exporting your data',`<p>Exporting saves all of your figures into a single file called <b>yak-data.json</b>. That includes your bills, payments, forecast deductions and the change log. It does not include your passcode.</p>
 <h3>How to export</h3>
 <ol><li>Tap the small <b>Export</b> button in the thin bar at the top of any page.</li>
 <li>Save the file. On a computer you may be asked where to put it. On a phone it is saved like any other download, so look in the Files app.</li></ol>
 <p>The bar shows when you last exported. It turns <b>orange and says "Unexported changes"</b> when you have changed something since, which is your cue to export again.</p>
 <div class="tip"><b>Keep it private:</b> the file is plain text with your finances in it, and it is not protected by the passcode. Store it somewhere only you can reach, and do not leave copies lying around.</div>`)}
 ${sec('Importing your data',`<p>Importing loads a YAK file back into the app. Use it to set up a new device, or to bring a device up to date after you have made changes somewhere else.</p>
 <h3>How to import</h3>
 <ol><li>Tap <b>Import latest data</b> on the Home tab (or at the very bottom of any page).</li>
 <li>Choose your <b>yak-data.json</b> file from Files or Downloads.</li>
 <li>YAK shows the file's name, which device it came from and when it was last changed. Tap <b>Replace my data</b> to go ahead, or <b>Cancel</b> to leave things as they are.</li></ol>
 <h3>Things to know</h3>
 <ul><li><b>Importing replaces everything.</b> The file is not merged with what is already on the device. Whatever is in the file becomes your data.</li>
 <li><b>YAK warns you if the file is older</b> than what is on the device, because importing it would overwrite newer figures. You then have to choose <b>Replace anyway</b>.</li>
 <li>If you choose a file that is not from YAK, you will see a message saying so and nothing changes.</li>
 <li>Files exported from earlier versions of YAK still work.</li></ul>`)}
 ${sec('Moving between devices',`<p>Say you have been using YAK on your laptop and want the latest figures on your phone:</p>
 <ol><li>On the laptop, tap <b>Export</b>.</li>
 <li>Get the file to your phone, for example by AirDrop, email to yourself, or a cloud folder such as iCloud Drive.</li>
 <li>On the phone, open YAK and tap <b>Import latest data</b>.</li></ol>
 <p>YAK helps you remember. On a brand new device it asks <b>"New on this device?"</b> so you can import straight away or start fresh. If you have been away for a day or more it asks <b>"Have you used YAK on another device since?"</b>. The <b>Switched device</b> box on Home also shows where the data on this device came from.</p>
 <div class="tip"><b>The golden rule:</b> use one device at a time. Export before you leave a device and import when you arrive on the next one. If you make changes on two devices without swapping files, the last file you import wins and the other changes are lost.</div>`)}
 ${sec('Starting again, and backups',`<p>At the very bottom of every page, <b>Reset to starting values</b> clears your figures back to blank. YAK asks you to confirm first. Export beforehand if you might want your data back.</p>
 <p>Your figures are stored in your web browser. If you clear your browser's website data or switch browsers, they will not be there. A recent export is your safety net, so get into the habit of exporting after you have made changes.</p>`)}
 </div>`}

/* ---------- Check for updates: fetch the live page fresh and reload if it is newer ---------- */
let UPD='',NEWV='',UCHK=0;
function newer(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false}
async function liveVersion(){
 const r=await fetch(location.pathname,{cache:'reload'});
 if(!r.ok)throw new Error('status '+r.status);
 const m=(await r.text()).match(/<meta name="version" content="([^"]+)"/);
 if(!m)throw new Error('no version');
 return m[1];
}
async function checkUpdate(){
 UPD='Checking...';render();
 try{
  const v=await liveVersion();
  if(v===VERSION){NEWV='';UPD='You have the latest version (v'+VERSION+').';render()}
  else{UPD='Updating to v'+v+'...';render();setTimeout(()=>location.reload(),600)}
 }catch(e){UPD='Could not check for updates. You may be offline.';render()}
}
/* Quiet check each time YAK opens (and when it comes back from the background), so nobody has to remember to press the button */
async function autoCheckUpdate(){
 if(Date.now()-UCHK<60000)return;UCHK=Date.now();
 try{const v=await liveVersion();const nv=newer(v,VERSION)?v:'';if(nv!==NEWV){NEWV=nv;render()}}catch(e){}
}
function updBox(){return NEWV?`<div class="card pending tb"><span><b>Update available for YAK</b> <small>(v${NEWV})</small></span><button class="btn sm" onclick="checkUpdate()">Update</button></div>`:''}
